<!doctype html><html lang="es" data-kora-product="1.0.0" data-kora-version="2.0.4"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA · Meta Ads Intelligence</title>
<link rel="stylesheet" href="/design-system/components/kora-dashboard.css">
<link rel="stylesheet" href="/design-system/components/kora-shell.css?v=2.0.4">
<link rel="stylesheet" href="/design-system/components/kora-product.css">
<script src="https://unpkg.com/lucide@1.27.0/dist/umd/lucide.min.js" defer></script>
<script src="/design-system/components/kora-product.js" defer></script>
<script src="/creditek/erp/sidebar.js?v=2.0.4" data-kora-shell="1.0.0" data-kora-shell-mode="agents"></script>
<script src="kora-agent-context.js" defer></script>
<style>
:root{--navy:var(--ctk-color-primary-900);--turq:var(--ctk-color-secondary-500);--bg:var(--ctk-color-background);--card:var(--ctk-color-surface);--muted:var(--ctk-color-text-muted);--border:var(--ctk-color-border);--red:var(--ctk-color-danger-700)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:var(--ctk-font-size-body)/var(--ctk-line-height-body) var(--ctk-font-family-ui)}.agent3-content{max-width:var(--ctk-width-content);margin:auto;padding:var(--ctk-space-4);min-width:0}.banner{padding:var(--ctk-space-2);border-radius:var(--ctk-radius-md);background:var(--ctk-color-secondary-50);border:1px solid var(--ctk-color-secondary-200);margin-bottom:var(--ctk-space-3);font-weight:var(--ctk-font-weight-semibold)}.banner.blocked{background:var(--ctk-color-warning-50);border-color:var(--ctk-color-warning-500);color:var(--ctk-color-primary-900)}.toolbar{display:flex;gap:var(--ctk-space-1);flex-wrap:wrap;margin-bottom:var(--ctk-space-3)}.toolbar select,.toolbar button{min-height:var(--ctk-height-control-md);padding:0 var(--ctk-space-2);border:1px solid var(--border);border-radius:var(--ctk-radius-sm);background:var(--card);font:inherit}.toolbar button{background:var(--navy);color:var(--ctk-color-neutral-0);font-weight:var(--ctk-font-weight-semibold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--ctk-space-2)}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--ctk-radius-xl);padding:var(--ctk-space-3);box-shadow:var(--ctk-shadow-1)}.label{font-size:var(--ctk-font-size-label);text-transform:uppercase;color:var(--muted);font-weight:var(--ctk-font-weight-bold);letter-spacing:var(--ctk-letter-spacing-label)}.value{font-family:var(--ctk-font-family-brand);font-size:var(--ctk-font-size-h2);font-weight:var(--ctk-font-weight-bold);margin-top:var(--ctk-space-1)}.panel{margin-top:var(--ctk-space-3);background:var(--card);border:1px solid var(--border);border-radius:var(--ctk-radius-xl);padding:var(--ctk-space-3);overflow:auto;box-shadow:var(--ctk-shadow-1)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:var(--ctk-space-2);border-bottom:1px solid var(--border)}th{font-size:var(--ctk-font-size-label);text-transform:uppercase;color:var(--muted);letter-spacing:var(--ctk-letter-spacing-label)}.error{color:var(--red)}.hidden{display:none}@media(max-width:47.999rem){.agent3-content{padding:var(--ctk-space-2);max-width:100%;overflow-x:hidden}.toolbar>*{flex:1 1 100%;min-width:0}.grid{grid-template-columns:1fr}.panel{padding:var(--ctk-space-2)}}
</style></head><body class="kora-product-page" data-kora-agent-id="agent-3">
<div id="app" data-kora-shell-root>
<main class="agent3-content">
  <div id="banner" class="banner blocked">Meta Ads pausado por seguridad: pendiente validación del backend AURA.</div>
  <div class="toolbar">
    <select id="period"><option value="7">7 días</option><option value="14">14 días</option><option value="30">30 días</option></select>
    <select disabled title="Disponible cuando exista clasificación backend"><option>Todos los municipios</option></select>
    <select disabled><option>Todas las plataformas</option></select><select disabled><option>Todos los orígenes</option></select>
    <button id="refresh">Actualizar</button>
  </div>
  <div id="error" class="panel error hidden"></div>
  <section class="grid" id="metrics"></section>
  <section class="panel"><h2>Campañas</h2><div id="campaigns">Cargando…</div></section>
  <section class="panel"><h2>Tendencia diaria</h2><div id="trends">Cargando…</div></section>
  <section class="panel"><h2>Alertas</h2><div id="alerts">Sin alertas.</div></section>
</main>
</div>
<script type="module">
import { auraSessionToken } from './agente3-aura-session.mjs';
const API='https://aura-meta-ads-api.comercial-853.workers.dev';
const money=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const integer=new Intl.NumberFormat('es-CO');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function metric(label,value){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`}
const errors={401:'La sesión AURA no es válida. Vuelve a iniciar sesión.',403:'No tienes permiso para consultar Meta Ads.',429:'Demasiadas consultas. Intenta nuevamente en un minuto.',502:'Meta no está disponible temporalmente.',503:'Meta Ads todavía no está configurado en el servidor.'};
function fail(message){document.querySelector('#error').textContent=message;document.querySelector('#error').classList.remove('hidden');document.querySelector('#campaigns').textContent='No fue posible cargar campañas.';document.querySelector('#trends').textContent='No fue posible cargar la tendencia diaria.'}
async function load(){
  document.querySelector('#error').classList.add('hidden');
  const token=auraSessionToken();
  if(!token){location.href='/creditek/agentes/?return_to='+encodeURIComponent(location.pathname);return}
  document.querySelector('#campaigns').textContent='Cargando…';document.querySelector('#trends').textContent='Cargando…';
  let response,data;
  try{response=await fetch(`${API}/v1/dashboard?period=${encodeURIComponent(document.querySelector('#period').value)}`,{headers:{authorization:`Bearer ${token}`}});data=await response.json().catch(()=>({}));}
  catch(error){fail('No fue posible conectar con Meta Ads. Intenta nuevamente.');return}
  if(!response.ok){fail(errors[response.status]||'Meta Ads no pudo completar la consulta.');return}
  document.querySelector('#banner').className='banner';document.querySelector('#banner').textContent='Meta Ads disponible en modo lectura.';
  const m=data.metrics||{};
  document.querySelector('#metrics').innerHTML=[metric('Gasto total',money.format(m.spend||0)),metric('Gasto semanal',money.format(m.spend_weekly||0)),metric('Gasto mensual',money.format(m.spend_monthly||0)),metric('Presupuesto semanal',money.format(m.budget_weekly||0)),metric('Impresiones',integer.format(m.impressions||0)),metric('Alcance',integer.format(m.reach||0)),metric('CTR',`${Number(m.ctr||0).toFixed(2)}%`),metric('CPC',money.format(m.cpc||0)),metric('CPM',money.format(m.cpm||0)),metric('Conversiones',integer.format(m.conversions||0)),metric('Costo por resultado',m.cost_per_result==null?'Sin datos':money.format(m.cost_per_result)),metric('Frecuencia',Number(m.frequency||0).toFixed(2)),metric('ROAS estimado','Sin atribución')].join('');
  document.querySelector('#campaigns').innerHTML=data.campaigns?.length?`<table><thead><tr><th>#</th><th>Campaña</th><th>Estado</th><th>Gasto</th><th>Resultados</th><th>CTR</th><th>Presupuesto diario</th></tr></thead><tbody>${data.campaigns.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.status)}</td><td>${money.format(c.metrics?.spend||0)}</td><td>${integer.format(c.metrics?.conversions||0)}</td><td>${Number(c.metrics?.ctr||0).toFixed(2)}%</td><td>${money.format(c.daily_budget||0)}</td></tr>`).join('')}</tbody></table>`:'Sin campañas.';
  document.querySelector('#trends').innerHTML=data.trends?.length?`<table><thead><tr><th>Fecha</th><th>Gasto</th><th>Impresiones</th><th>Clics</th><th>Conversiones</th></tr></thead><tbody>${data.trends.map(t=>`<tr><td>${esc(t.date)}</td><td>${money.format(t.spend||0)}</td><td>${integer.format(t.impressions||0)}</td><td>${integer.format(t.clicks||0)}</td><td>${integer.format(t.conversions||0)}</td></tr>`).join('')}</tbody></table>`:'Sin tendencia disponible.';
  document.querySelector('#alerts').innerHTML=data.alerts?.length?data.alerts.map(a=>`<p>${esc(a.message)}</p>`).join(''):'Sin alertas.';
}
document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#period').addEventListener('change',load);load();
</script></body></html>
