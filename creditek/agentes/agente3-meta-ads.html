<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA · Meta Ads Intelligence</title>
<style>
:root{--navy:#0B1E3D;--turq:#00C4CC;--bg:#f3f6f9;--card:#fff;--muted:#64748b;--border:#dbe4ee;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px system-ui,sans-serif}.header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.header h1{font-size:18px;margin:0}.header small{color:#9eecef}.main{max-width:1200px;margin:auto;padding:24px}.banner{padding:14px 18px;border-radius:12px;background:#e6fbfc;border:1px solid #9be6e9;margin-bottom:18px;font-weight:650}.banner.blocked{background:#fff4ed;border-color:#fed7aa;color:#9a3412}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar select,.toolbar button{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fff}.toolbar button{background:var(--navy);color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px}.label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}.value{font-size:25px;font-weight:750;margin-top:8px}.panel{margin-top:18px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--border)}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.error{color:var(--red)}.hidden{display:none}@media(max-width:600px){.main{padding:14px}.header{padding:15px}}
</style></head><body>
<header class="header"><div><h1>Meta Ads Intelligence</h1><small>Agente 3 · AURA</small></div><strong>Solo lectura</strong></header>
<main class="main">
  <div id="banner" class="banner blocked">Meta Ads pausado por seguridad: pendiente validación del backend AURA.</div>
  <div class="toolbar">
    <select id="period"><option value="7">7 días</option><option value="14">14 días</option><option value="30">30 días</option></select>
    <select disabled title="Disponible cuando exista clasificación backend"><option>Todos los municipios</option></select>
    <select disabled><option>Todas las plataformas</option></select><select disabled><option>Todos los orígenes</option></select>
    <button id="refresh">Actualizar</button>
  </div>
  <div id="error" class="panel error hidden"></div>
  <section class="grid" id="metrics"></section>
  <section class="panel"><h2>Campañas</h2><div id="campaigns">Cargando…</div></section>
  <section class="panel"><h2>Tendencia diaria</h2><div id="trends">Cargando…</div></section>
  <section class="panel"><h2>Alertas</h2><div id="alerts">Sin alertas.</div></section>
</main>
<script type="module">
import { auraSessionToken } from './agente3-aura-session.mjs';
const API='https://aura-meta-ads-api.comercial-853.workers.dev';
const money=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const integer=new Intl.NumberFormat('es-CO');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function metric(label,value){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function fail(message){document.querySelector('#error').textContent=message;document.querySelector('#error').classList.remove('hidden')}
async function load(){
  document.querySelector('#error').classList.add('hidden');
  const token=auraSessionToken();
  if(!token){location.href='/creditek/agentes/?return_to='+encodeURIComponent(location.pathname);return}
  const response=await fetch(`${API}/v1/dashboard?period=${encodeURIComponent(document.querySelector('#period').value)}`,{headers:{authorization:`Bearer ${token}`}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok){fail(data.error==='Forbidden'?'No tienes permiso para consultar Meta Ads.':'Meta Ads continúa bloqueado de forma segura.');return}
  document.querySelector('#banner').className='banner';document.querySelector('#banner').textContent='Meta Ads disponible en modo lectura.';
  const m=data.metrics||{};
  document.querySelector('#metrics').innerHTML=[metric('Gasto total',money.format(m.spend||0)),metric('Gasto semanal',money.format(m.spend_weekly||0)),metric('Gasto mensual',money.format(m.spend_monthly||0)),metric('Presupuesto semanal',money.format(m.budget_weekly||0)),metric('Impresiones',integer.format(m.impressions||0)),metric('Alcance',integer.format(m.reach||0)),metric('CTR',`${Number(m.ctr||0).toFixed(2)}%`),metric('CPC',money.format(m.cpc||0)),metric('CPM',money.format(m.cpm||0)),metric('Conversiones',integer.format(m.conversions||0)),metric('Costo por resultado',m.cost_per_result==null?'Sin datos':money.format(m.cost_per_result)),metric('Frecuencia',Number(m.frequency||0).toFixed(2)),metric('ROAS estimado','Sin atribución')].join('');
  document.querySelector('#campaigns').innerHTML=data.campaigns?.length?`<table><thead><tr><th>#</th><th>Campaña</th><th>Estado</th><th>Gasto</th><th>Resultados</th><th>CTR</th><th>Presupuesto diario</th></tr></thead><tbody>${data.campaigns.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.status)}</td><td>${money.format(c.metrics?.spend||0)}</td><td>${integer.format(c.metrics?.conversions||0)}</td><td>${Number(c.metrics?.ctr||0).toFixed(2)}%</td><td>${money.format(c.daily_budget||0)}</td></tr>`).join('')}</tbody></table>`:'Sin campañas.';
  document.querySelector('#trends').innerHTML=data.trends?.length?`<table><thead><tr><th>Fecha</th><th>Gasto</th><th>Impresiones</th><th>Clics</th><th>Conversiones</th></tr></thead><tbody>${data.trends.map(t=>`<tr><td>${esc(t.date)}</td><td>${money.format(t.spend||0)}</td><td>${integer.format(t.impressions||0)}</td><td>${integer.format(t.clicks||0)}</td><td>${integer.format(t.conversions||0)}</td></tr>`).join('')}</tbody></table>`:'Sin tendencia disponible.';
  document.querySelector('#alerts').innerHTML=data.alerts?.length?data.alerts.map(a=>`<p>${esc(a.message)}</p>`).join(''):'Sin alertas.';
}
document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#period').addEventListener('change',load);load();
</script></body></html>
