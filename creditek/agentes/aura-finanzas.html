<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inversiones — AURA</title>
<style>
:root{--navy:#0b1e3d;--turq:#13b8a6;--ink:#172033;--muted:#738096;--bg:#f5f7fb;--line:#e4e9f1;--white:#fff;--red:#dc4b5f;--green:#07866f;--violet:#5753e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:1240px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.eyebrow{color:var(--turq);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.top h1{font-size:28px;margin:4px 0 2px}.top p{margin:0;color:var(--muted)}.pill{background:var(--white);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.pill.pending{color:#9a6200}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 5px 18px #0b1e3d0b}.portfolio-head{display:flex;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800}.name{font-size:17px;font-weight:800}.muted{color:var(--muted);font-size:12px}.money{text-align:right}.balance{font-size:23px;font-weight:850}.change{font-weight:750}.positive{color:var(--green)}.negative{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{background:var(--bg);border-radius:9px;padding:10px}.metric strong{display:block;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:7px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid #edf0f5}th:last-child,td:last-child{text-align:right}.symbol{font-weight:800}.policy{margin-top:12px;padding:10px 12px;background:#f0efff;color:#38358a;border-radius:9px;font-size:12px}.wide{grid-column:1/-1}.reports{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.report{padding:13px;border:1px solid var(--line);border-radius:10px}.report h3{margin:0 0 5px;font-size:14px}.report p{margin:0;color:var(--muted);font-size:12px;white-space:pre-line}.lock{min-height:320px;display:grid;place-items:center;text-align:center}.lock-icon{font-size:30px}.error{color:var(--red)}button{border:0;background:var(--navy);color:white;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}.foot{color:var(--muted);font-size:11px;margin-top:16px}@media(max-width:800px){.page{padding:16px}.top{align-items:flex-start;flex-direction:column}.grid,.reports{grid-template-columns:1fr}.wide{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}}
</style><style>
#state.lock{width:max-content;max-width:100%;min-height:0;margin:0 0 12px auto;padding:7px 10px;display:flex;align-items:center;gap:7px;text-align:left;border-radius:999px;box-shadow:none;color:var(--muted);font-size:11px}
#state.lock .lock-icon{font-size:13px}
#state.lock h2{margin:0;font-size:11px;color:var(--ink)}
#state.lock p{margin:0}
[hidden]{display:none!important}
.summary{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin:0 0 16px}.summary-card{background:linear-gradient(135deg,var(--navy),#173767);color:#fff;border-radius:14px;padding:18px}.summary-card small{color:#b7c6dc;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.summary-card h2{margin:7px 0 2px;font-size:22px}.summary-card p{margin:0;color:#d9e2ef;font-size:12px}.benchmark{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.benchmark h3{margin:0 0 10px}.benchmark-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #edf0f5}.benchmark-row:last-child{border:0}.position-value{font-weight:700}.weight{color:var(--muted);font-size:11px}.signal{display:inline-flex;align-items:center;padding:3px 7px;border-radius:99px;background:#edf0f5;color:#4d596c;font-size:10px;font-weight:800;text-transform:uppercase}.signal.keep{background:#e8f7f2;color:var(--green)}.signal.watch{background:#fff4dd;color:#966000}.reports{grid-template-columns:1fr 1fr}.report.featured{border-color:#c9c7ff;background:#f8f7ff}.report-meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.report-tag{padding:3px 7px;border-radius:99px;background:#edf0f5;color:#566174;font-size:10px;font-weight:750}.report-summary{color:var(--ink)!important;line-height:1.55}.report-empty{color:var(--muted)}
@media(max-width:800px){.summary{grid-template-columns:1fr}.reports{grid-template-columns:1fr}}
</style></head><body><main class="page">
<header class="top"><div><div class="eyebrow">AURA · Inteligencia de inversión</div><h1>Inversiones</h1><p>Seguimiento privado y separado de las carteras JA y Óscar.</p></div><div class="pill pending" id="wa-status">● WhatsApp · verificando</div></header>
<section id="state" class="card lock"><span class="lock-icon">🔒</span><h2>Validando acceso privado…</h2></section>
<section id="dashboard" class="grid" hidden></section>
<div class="foot">Información de apoyo para la toma de decisiones. AURA no ejecuta órdenes ni garantiza rentabilidad.</div>
</main><script>
const API='https://finanzas.crediteksas.com/api/dashboard';
const money=new Intl.NumberFormat('es-CO',{style:'currency',currency:'USD'});
const number=new Intl.NumberFormat('es-CO',{maximumFractionDigits:8});
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function session(){try{return JSON.parse(sessionStorage.getItem('aura_supa_session')||'null')}catch{return null}}
function positionValue(x){return Number(x.quantity||0)*Number(x.unitPrice||0)}
function positionSignal(x){const pct=Number(x.dayChangePct);return Math.abs(pct)>=3?'watch':'keep'}
function portfolioCard(key,p){const invested=(p.positions||[]).reduce((s,x)=>s+positionValue(x),0);const positions=(p.positions||[]).map(x=>{const value=positionValue(x),weight=invested?value/invested*100:0,pct=Number(x.dayChangePct);const daily=Number.isFinite(pct)?`<div class="${pct>=0?'positive':'negative'}">${pct>=0?'+':''}${number.format(pct)}%</div>`:'';return `<tr><td><div class="symbol">${safe(x.symbol)}</div><span class="signal ${positionSignal(x)}">${positionSignal(x)==='watch'?'Vigilar':'Mantener'}</span></td><td><div class="position-value">${money.format(value)}</div><div class="weight">${number.format(weight)}% · ${number.format(x.quantity)} uds.</div></td><td>${money.format(x.unitPrice)}${daily}</td></tr>`}).join('');const cls=p.dayChange>=0?'positive':'negative';return `<article class="card"><div class="portfolio-head"><div class="identity"><div class="avatar">${safe(p.accountBadge||key)}</div><div><div class="name">Cartera ${key==='OSCAR'?'Óscar':'JA'}</div><div class="muted">Cuenta independiente · USD</div></div></div><div class="money"><div class="balance">${money.format(p.balance)}</div><div class="change ${cls}">${p.dayChange>=0?'+':''}${money.format(p.dayChange)} · ${p.dayChangePct>=0?'+':''}${number.format(p.dayChangePct)}% hoy</div></div></div><div class="metrics"><div class="metric"><span class="muted">Poder de compra</span><strong>${money.format(p.cash)}</strong></div><div class="metric"><span class="muted">Invertido</span><strong>${money.format(invested)}</strong></div><div class="metric"><span class="muted">Actualización</span><strong>${safe(currentAsOf)}</strong></div></div><div class="table-wrap"><table><thead><tr><th>Activo / decisión</th><th>Valor / peso</th><th>Precio / día</th></tr></thead><tbody>${positions}</tbody></table></div><div class="policy">${safe(p.mandate||'Cartera de crecimiento diversificada; límites formales pendientes de documentar.')}</div></article>`}
let currentAsOf='—';function reportCard(title,r,featured=false){return `<div class="report ${featured?'featured':''}"><h3>${title}</h3>${r?`<div class="report-meta"><span class="report-tag">${safe(r.fecha)}</span><span class="report-tag">Informe guardado</span></div><p class="report-summary">${safe(r.resumen)}</p>`:'<p class="report-empty">Todavía no hay un informe almacenado.</p>'}</div>`}
async function load(){const s=session();if(!s?.access_token)throw new Error('Inicia sesión nuevamente en AURA para ver esta información.');const res=await fetch(API,{headers:{Authorization:`Bearer ${s.access_token}`}});if(!res.ok)throw new Error(res.status===401?'Tu sesión no está autorizada o venció.':'No fue posible cargar Inversiones.');const data=await res.json();if(!data.portfolio)throw new Error('La protección está activa; falta cargar la primera foto de las carteras.');currentAsOf=new Date(data.portfolio.asOf).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});const p=data.portfolio.portfolios;const latest=data.informes.cierre||data.informes.apertura;document.getElementById('dashboard').innerHTML=`<section class="summary wide"><div class="summary-card"><small>Resumen ejecutivo</small><h2>${latest?safe(latest.resumen):'Esperando el primer informe'}</h2><p>Las dos carteras se analizan por separado. Ninguna recomendación ejecuta operaciones automáticamente.</p></div><div class="benchmark"><h3>Marco de comparación</h3><div class="benchmark-row"><span>Mercado amplio</span><strong>VOO</strong></div><div class="benchmark-row"><span>Tecnología</span><strong>QQQ</strong></div><div class="benchmark-row"><span>Activo de riesgo</span><strong>BTC-USD</strong></div><div class="benchmark-row"><span>Conversión a pesos</span><strong>USD/COP</strong></div></div></section>`+portfolioCard('OSCAR',p.OSCAR)+portfolioCard('JA',p.JA)+`<article class="card wide"><h2 style="margin-top:0">Informes y decisiones</h2><div class="reports">${reportCard('☀️ Apertura · 9:35 a. m.',data.informes.apertura)}${reportCard('🌙 Cierre · 4:35 p. m.',data.informes.cierre,true)}</div></article>`;document.getElementById('state').hidden=true;document.getElementById('dashboard').hidden=false;document.getElementById('wa-status').textContent=data.whatsapp==='active'?'● WhatsApp · activo':'● WhatsApp · línea en revisión de Meta'}
load().catch(err=>{document.getElementById('state').innerHTML=`<div><div class="lock-icon">🔒</div><h2>Acceso privado protegido</h2><p class="error">${safe(err.message)}</p><button onclick="location.reload()">Intentar nuevamente</button></div>`});
</script></body></html>
