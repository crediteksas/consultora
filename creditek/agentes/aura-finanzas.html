<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inversiones — AURA</title>
<style>
:root{--navy:#0b1e3d;--turq:#13b8a6;--ink:#172033;--muted:#738096;--bg:#f5f7fb;--line:#e4e9f1;--white:#fff;--red:#dc4b5f;--green:#07866f;--violet:#5753e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:1240px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.eyebrow{color:var(--turq);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.top h1{font-size:28px;margin:4px 0 2px}.top p{margin:0;color:var(--muted)}.pill{background:var(--white);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.pill.pending{color:#9a6200}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 5px 18px #0b1e3d0b}.portfolio-head{display:flex;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800}.name{font-size:17px;font-weight:800}.muted{color:var(--muted);font-size:12px}.money{text-align:right}.balance{font-size:23px;font-weight:850}.change{font-weight:750}.positive{color:var(--green)}.negative{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{background:var(--bg);border-radius:9px;padding:10px}.metric strong{display:block;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:7px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid #edf0f5}th:last-child,td:last-child{text-align:right}.symbol{font-weight:800}.policy{margin-top:12px;padding:10px 12px;background:#f0efff;color:#38358a;border-radius:9px;font-size:12px}.wide{grid-column:1/-1}.reports{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.report{padding:13px;border:1px solid var(--line);border-radius:10px}.report h3{margin:0 0 5px;font-size:14px}.report p{margin:0;color:var(--muted);font-size:12px;white-space:pre-line}.lock{min-height:320px;display:grid;place-items:center;text-align:center}.lock-icon{font-size:30px}.error{color:var(--red)}button{border:0;background:var(--navy);color:white;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}.foot{color:var(--muted);font-size:11px;margin-top:16px}@media(max-width:800px){.page{padding:16px}.top{align-items:flex-start;flex-direction:column}.grid,.reports{grid-template-columns:1fr}.wide{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}}
</style><style>
#state.lock{width:max-content;max-width:100%;min-height:0;margin:0 0 12px auto;padding:7px 10px;display:flex;align-items:center;gap:7px;text-align:left;border-radius:999px;box-shadow:none;color:var(--muted);font-size:11px}
#state.lock .lock-icon{font-size:13px}
#state.lock h2{margin:0;font-size:11px;color:var(--ink)}
#state.lock p{margin:0}
[hidden]{display:none!important}
.summary{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin:0 0 16px}.summary-card{background:linear-gradient(135deg,var(--navy),#173767);color:#fff;border-radius:14px;padding:18px}.summary-card small{color:#b7c6dc;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.summary-card h2{margin:7px 0 2px;font-size:22px}.summary-card p{margin:0;color:#d9e2ef;font-size:12px}.benchmark{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.benchmark h3{margin:0 0 10px}.position-value{font-weight:700}.weight{color:var(--muted);font-size:11px}.signal{display:inline-flex;align-items:center;padding:3px 7px;border-radius:99px;background:#edf0f5;color:#4d596c;font-size:10px;font-weight:800;text-transform:uppercase}.signal.keep{background:#e8f7f2;color:var(--green)}.signal.watch{background:#fff4dd;color:#966000}.reports{grid-template-columns:1fr 1fr}.report.featured{border-color:#c9c7ff;background:#f8f7ff}.report-meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.report-tag{padding:3px 7px;border-radius:99px;background:#edf0f5;color:#566174;font-size:10px;font-weight:750}.report-summary{color:var(--ink)!important;line-height:1.55}.report-empty{color:var(--muted)}.decision-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.decision-card{border:1px solid var(--line);border-left:4px solid var(--turq);border-radius:10px;padding:12px;background:#fff}.decision-card.watch{border-left-color:#e3a008}.decision-card.reduce,.decision-card.exit{border-left-color:var(--red)}.decision-card.add{border-left-color:#4f46e5}.decision-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.decision-action{font-size:10px;font-weight:850;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:#edf0f5}.decision-card.keep .decision-action{background:#e8f7f2;color:var(--green)}.decision-card.watch .decision-action{background:#fff4dd;color:#966000}.decision-card.reduce .decision-action,.decision-card.exit .decision-action{background:#fdecef;color:var(--red)}.decision-card.add .decision-action{background:#ecebff;color:#423fbd}.decision-card p{margin:7px 0 0;color:var(--muted);font-size:12px}.stale{background:#fff4dd;color:#7a5200;border:1px solid #f3d48e;border-radius:10px;padding:10px 12px;margin-bottom:12px}.report-details{white-space:pre-wrap;line-height:1.6;color:var(--ink);font-size:12px;max-height:330px;overflow:auto;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.report details summary{cursor:pointer;color:var(--violet);font-weight:750;margin-top:10px}.source-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.source{background:var(--bg);border-radius:9px;padding:10px}.source strong{display:block}.source small{color:var(--muted)}
@media(max-width:800px){.summary{grid-template-columns:1fr}.reports,.decision-grid,.source-strip{grid-template-columns:1fr}}
</style></head><body><main class="page">
<header class="top"><div><div class="eyebrow">AURA · Inteligencia de inversión</div><h1>Inversiones</h1><p>Seguimiento privado y separado de las carteras JA y Óscar.</p></div><div class="pill pending" id="wa-status">● WhatsApp · verificando</div></header>
<section id="state" class="card lock"><span class="lock-icon">🔒</span><h2>Validando acceso privado…</h2></section>
<section id="dashboard" class="grid" hidden></section>
<div class="foot">Información de apoyo para la toma de decisiones. AURA no ejecuta órdenes ni garantiza rentabilidad.</div>
</main><script>
const API='https://finanzas.crediteksas.com/api/dashboard';
const SUPA_BASE='https://ditiwpndvmyuqcagupea.supabase.co';
const SUPA_KEY='sb_publishable_oVNantrnKzXdtXu5B7YQIg_9fxHp7aW';
const money=new Intl.NumberFormat('es-CO',{style:'currency',currency:'USD'});
const number=new Intl.NumberFormat('es-CO',{maximumFractionDigits:8});
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function session(){try{return JSON.parse(sessionStorage.getItem('aura_supa_session')||'null')}catch{return null}}
async function refreshSession(){const s=session();if(!s?.refresh_token)return null;try{const r=await fetch(SUPA_BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)return null;const d=await r.json();const next={...s,...d,access_token:d.access_token,refresh_token:d.refresh_token||s.refresh_token,expires_at:d.expires_at};sessionStorage.setItem('aura_supa_session',JSON.stringify(next));sessionStorage.setItem('ck_supa_session',JSON.stringify(next));return next}catch{return null}}
function positionValue(x){return Number(x.quantity||0)*Number(x.unitPrice||0)}
function signalLabel(signal){return({keep:'Mantener',watch:'Vigilar',add:'Añadir',reduce:'Reducir',exit:'Salir'})[signal]||'Vigilar'}
function positionSignal(x,weight){const explicit=String(x.action||x.signal||'').toLowerCase();if(['buy','add','añadir'].includes(explicit))return'add';if(['reduce','reducir'].includes(explicit))return'reduce';if(['exit','salir'].includes(explicit))return'exit';if(['watch','vigilar'].includes(explicit))return'watch';const pct=Number(x.dayChangePct);return weight>30||Math.abs(pct)>=3?'watch':'keep'}
function portfolioCard(key,p){const invested=(p.positions||[]).reduce((s,x)=>s+positionValue(x),0);const positions=(p.positions||[]).map(x=>{const value=positionValue(x),weight=invested?value/invested*100:0,pct=Number(x.dayChangePct),signal=positionSignal(x,weight);const daily=Number.isFinite(pct)?`<div class="${pct>=0?'positive':'negative'}">${pct>=0?'+':''}${number.format(pct)}%</div>`:'';return `<tr><td><div class="symbol">${safe(x.symbol)}</div><span class="signal ${signal==='keep'?'keep':'watch'}">${signalLabel(signal)}</span></td><td><div class="position-value">${money.format(value)}</div><div class="weight">${number.format(weight)}% · ${number.format(x.quantity)} uds.</div></td><td>${money.format(x.unitPrice)}${daily}</td></tr>`}).join('');const cls=p.dayChange>=0?'positive':'negative';return `<article class="card"><div class="portfolio-head"><div class="identity"><div class="avatar">${safe(p.accountBadge||key)}</div><div><div class="name">Cartera ${key==='OSCAR'?'Óscar':'JA'}</div><div class="muted">Cuenta independiente · USD</div></div></div><div class="money"><div class="balance">${money.format(p.balance)}</div><div class="change ${cls}">${p.dayChange>=0?'+':''}${money.format(p.dayChange)} · ${p.dayChangePct>=0?'+':''}${number.format(p.dayChangePct)}% hoy</div></div></div><div class="metrics"><div class="metric"><span class="muted">Poder de compra</span><strong>${money.format(p.cash)}</strong></div><div class="metric"><span class="muted">Invertido</span><strong>${money.format(invested)}</strong></div><div class="metric"><span class="muted">Actualización</span><strong>${safe(currentAsOf)}</strong></div></div><div class="table-wrap"><table><thead><tr><th>Activo / señal</th><th>Valor / peso</th><th>Precio / día</th></tr></thead><tbody>${positions}</tbody></table></div><div class="policy">${safe(p.mandate||'Cartera de crecimiento diversificada; límites formales pendientes de documentar.')}</div></article>`}
let currentAsOf='—';
function reportCard(title,r,featured=false){return `<div class="report ${featured?'featured':''}"><h3>${title}</h3>${r?`<div class="report-meta"><span class="report-tag">${safe(r.fecha)}</span><span class="report-tag">${safe(r.sesion||'informe')}</span></div><p class="report-summary">${safe(r.resumen)}</p><details><summary>Leer análisis completo</summary><div class="report-details">${safe(r.informe||'El informe completo no está disponible.')}</div></details>`:'<p class="report-empty">Todavía no hay un informe almacenado. No se inventarán recomendaciones sin datos.</p>'}</div>`}
function decisionCards(data){const decisions=Array.isArray(data.decisiones)?data.decisiones:[];if(!decisions.length)return '<p class="report-empty">No hay decisiones vigentes. El próximo informe debe incluir acción, tesis, riesgo e invalidación.</p>';return `<div class="decision-grid">${decisions.slice(0,5).map(d=>{const action=String(d.action||'watch').toLowerCase();return `<div class="decision-card ${safe(action)}"><div class="decision-top"><strong>${safe(d.account||'')} · ${safe(d.symbol||'Cartera')}</strong><span class="decision-action">${safe(signalLabel(action))}</span></div><p><strong>Tesis:</strong> ${safe(d.thesis||'Pendiente')}</p><p><strong>Riesgo / invalidación:</strong> ${safe(d.invalidation||d.risk||'Pendiente')}</p>${d.range?`<p><strong>Rango:</strong> ${safe(d.range)}</p>`:''}</div>`}).join('')}</div>`}
async function authorizedFetch(s){let res=await fetch(API,{headers:{Authorization:`Bearer ${s.access_token}`}});if(res.status===401){const next=await refreshSession();if(next)res=await fetch(API,{headers:{Authorization:`Bearer ${next.access_token}`}})}return res}
async function load(){const s=session();if(!s?.access_token)throw new Error('Inicia sesión nuevamente en AURA para ver esta información.');const res=await authorizedFetch(s);if(!res.ok)throw new Error(res.status===401?'Tu sesión no está autorizada o venció. Vuelve al inicio de AURA e inicia sesión.':'No fue posible cargar Inversiones.');const data=await res.json();if(!data.portfolio)throw new Error('La protección está activa; falta cargar la primera foto de las carteras.');const asOf=new Date(data.portfolio.asOf),ageHours=(Date.now()-asOf.getTime())/36e5;currentAsOf=asOf.toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});const p=data.portfolio.portfolios;const latest=data.informes.cierre||data.informes.apertura;const stale=ageHours>24?`<div class="stale wide"><strong>Datos desactualizados:</strong> la última fotografía tiene ${Math.floor(ageHours)} horas. No tomes decisiones de compra o venta hasta actualizar Hapi.</div>`:'';document.getElementById('dashboard').innerHTML=stale+`<section class="summary wide"><div class="summary-card"><small>Resumen ejecutivo</small><h2>${latest?safe(latest.resumen):'Esperando el primer informe verificable'}</h2><p>Las dos carteras se analizan por separado. Ninguna recomendación ejecuta operaciones automáticamente.</p></div><div class="benchmark"><h3>Fuentes y comparación</h3><div class="source-strip"><div class="source"><strong>Hapi</strong><small>Posiciones y efectivo</small></div><div class="source"><strong>Financial Datasets</strong><small>Acciones, SEC y noticias</small></div><div class="source"><strong>CoinMarketCap</strong><small>Bitcoin y riesgo cripto</small></div><div class="source"><strong>VOO · QQQ · BTC-USD · USD/COP</strong><small>Referencias obligatorias</small></div></div></div></section>`+portfolioCard('OSCAR',p.OSCAR)+portfolioCard('JA',p.JA)+`<article class="card wide"><h2 style="margin-top:0">Qué hacemos ahora</h2>${decisionCards(latest||{})}</article><article class="card wide"><h2 style="margin-top:0">Informes de apertura y cierre</h2><div class="reports">${reportCard('☀️ Apertura · 9:35 a. m.',data.informes.apertura)}${reportCard('🌙 Cierre · 4:35 p. m.',data.informes.cierre,true)}</div></article>`;document.getElementById('state').hidden=true;document.getElementById('dashboard').hidden=false;document.getElementById('wa-status').textContent=data.whatsapp==='active'?'● WhatsApp · activo':'● WhatsApp · pendiente de conexión'}
load().catch(err=>{document.getElementById('state').innerHTML=`<div><div class="lock-icon">🔒</div><h2>Acceso privado protegido</h2><p class="error">${safe(err.message)}</p><button onclick="location.reload()">Intentar nuevamente</button></div>`});
</script></body></html>
