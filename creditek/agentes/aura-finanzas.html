<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía Finanzas — AURA</title>
<style>
:root{--navy:#0b1e3d;--turq:#13b8a6;--ink:#172033;--muted:#738096;--bg:#f5f7fb;--line:#e4e9f1;--white:#fff;--red:#dc4b5f;--green:#07866f;--violet:#5753e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:1240px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.eyebrow{color:var(--turq);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.top h1{font-size:28px;margin:4px 0 2px}.top p{margin:0;color:var(--muted)}.pill{background:var(--white);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.pill.pending{color:#9a6200}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 5px 18px #0b1e3d0b}.portfolio-head{display:flex;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800}.name{font-size:17px;font-weight:800}.muted{color:var(--muted);font-size:12px}.money{text-align:right}.balance{font-size:23px;font-weight:850}.change{font-weight:750}.positive{color:var(--green)}.negative{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{background:var(--bg);border-radius:9px;padding:10px}.metric strong{display:block;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:7px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid #edf0f5}th:last-child,td:last-child{text-align:right}.symbol{font-weight:800}.policy{margin-top:12px;padding:10px 12px;background:#f0efff;color:#38358a;border-radius:9px;font-size:12px}.wide{grid-column:1/-1}.reports{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.report{padding:13px;border:1px solid var(--line);border-radius:10px}.report h3{margin:0 0 5px;font-size:14px}.report p{margin:0;color:var(--muted);font-size:12px;white-space:pre-line}.lock{min-height:320px;display:grid;place-items:center;text-align:center}.lock-icon{font-size:30px}.error{color:var(--red)}button{border:0;background:var(--navy);color:white;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}.foot{color:var(--muted);font-size:11px;margin-top:16px}@media(max-width:800px){.page{padding:16px}.top{align-items:flex-start;flex-direction:column}.grid,.reports{grid-template-columns:1fr}.wide{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}}
</style><style>
#state.lock{width:max-content;max-width:100%;min-height:0;margin:0 0 12px auto;padding:7px 10px;display:flex;align-items:center;gap:7px;text-align:left;border-radius:999px;box-shadow:none;color:var(--muted);font-size:11px}
#state.lock .lock-icon{font-size:13px}
#state.lock h2{margin:0;font-size:11px;color:var(--ink)}
#state.lock p{margin:0}
[hidden]{display:none!important}
</style><style>
.page{max-width:1400px;padding:16px}.top{margin-bottom:10px;align-items:center}.top .eyebrow,.top p{display:none}.top h1{font-size:24px}.grid{display:block}.portfolio-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.portfolio-card{padding:14px;min-width:0}.portfolio-card+.portfolio-card{border-left:1px solid var(--line)}.portfolio-head{align-items:center;margin-bottom:10px}.identity .avatar{border-radius:50%;background:#e8efff;color:#315fdb}.portfolio-card.ja .avatar{background:#eee8ff;color:#6541cf}.kpis4{display:grid;grid-template-columns:1.25fr .9fr .8fr .55fr;gap:6px}.kpis4 .metric{margin:0;border:1px solid var(--line);background:#fff;min-height:76px;padding:9px}.kpis4 .metric strong{font-size:14px}.allocation-risk{display:grid;grid-template-columns:1.15fr .85fr;gap:7px;margin-top:7px}.mini-panel{border:1px solid var(--line);border-radius:9px;padding:10px}.mini-panel h3{font-size:11px;margin:0 0 8px}.allocation-body{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px}.donut{width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--c1) 0 var(--pct),var(--c2) var(--pct) 100%);display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;width:39px;height:39px;border-radius:50%;background:#fff}.donut b{position:relative;z-index:1;font-size:9px}.legend{font-size:9px}.legend div{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid #edf0f5}.risk-title{font-size:14px;font-weight:800;color:#315fdb;border-bottom:1px solid var(--line);padding-bottom:7px}.ja .risk-title{color:#6541cf}.risk-copy{font-size:9px;color:var(--muted);display:grid;gap:6px;margin-top:8px}.positions{border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:7px}.positions h3{font-size:11px;margin:0 0 6px}.positions td{padding:5px 3px;font-size:9px}.positions th{font-size:8px}.decision-strip{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px}.decision-box{padding:12px;min-height:150px}.decision-box+.decision-box{border-left:1px solid var(--line)}.decision-box h3{font-size:11px;margin:0 0 10px}.decision-box p,.decision-box li{font-size:9px;color:var(--muted)}.decision-box ul{padding-left:15px;margin:0;display:grid;gap:7px}.report-badge{display:inline-block;background:#111e58;color:#fff;border-radius:6px;padding:10px 8px;font-size:8px;font-weight:800;margin-bottom:7px}.schedule-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #edf0f5;font-size:9px}.foot{margin-top:9px}@media(max-width:1000px){.portfolio-grid{grid-template-columns:1fr}.portfolio-card+.portfolio-card{border-left:0;border-top:1px solid var(--line)}.decision-strip{grid-template-columns:1fr 1fr}.decision-box:nth-child(3){border-left:0;border-top:1px solid var(--line)}.decision-box:nth-child(4){border-top:1px solid var(--line)}}@media(max-width:650px){.kpis4{grid-template-columns:1fr 1fr}.allocation-risk,.decision-strip{grid-template-columns:1fr}.decision-box+.decision-box{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><main class="page">
<header class="top"><div><div class="eyebrow">AURA · Inteligencia de inversión</div><h1>Sofía Finanzas</h1><p>Seguimiento privado de las carteras JA y Óscar.</p></div><div class="pill pending" id="wa-status">● WhatsApp AURA · verificando</div></header>
<section id="state" class="card lock"><span class="lock-icon">🔒</span><h2>Validando acceso privado…</h2></section>
<section id="dashboard" class="grid" hidden></section>
<div class="foot">Información de apoyo para la toma de decisiones. AURA no ejecuta órdenes ni garantiza rentabilidad.</div>
</main><script>
const API='https://finanzas.crediteksas.com/api/dashboard';
const money=new Intl.NumberFormat('es-CO',{style:'currency',currency:'USD'});
const number=new Intl.NumberFormat('es-CO',{maximumFractionDigits:8});
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function session(){try{return JSON.parse(sessionStorage.getItem('aura_supa_session')||localStorage.getItem('aura_supa_session')||'null')}catch{return null}}
const assetNames={BTCUSD:'Bitcoin',QQQ:'Invesco QQQ',VOO:'Vanguard S&P 500',GOOGL:'Alphabet',AMZN:'Amazon',PLTR:'Palantir',SGOV:'Treasury 0–3 meses',SOFI:'SoFi',META:'Meta Platforms',TSLA:'Tesla',AAPL:'Apple',NVDA:'NVIDIA',CVX:'Chevron'};
function posValue(x){return Number(x.quantity||0)*Number(x.unitPrice||0)}
function portfolioCard(key,p){const total=(p.positions||[]).reduce((s,x)=>s+posValue(x),0)||1;const defensive=(p.positions||[]).filter(x=>x.symbol==='SGOV').reduce((s,x)=>s+posValue(x),0);const safePct=key==='OSCAR'?Math.round(defensive/total*100):0;const growthPct=100-safePct;const positions=[...(p.positions||[])].sort((a,b)=>posValue(b)-posValue(a)).map(x=>`<tr><td class="symbol">${safe(x.symbol)}</td><td>${safe(assetNames[x.symbol]||x.symbol)}</td><td>${number.format(posValue(x)/p.balance*100)}%</td><td>${money.format(x.unitPrice)}</td></tr>`).join('');const cls=p.dayChange>=0?'positive':'negative';const risk=key==='OSCAR'?'Moderado-agresivo':'Agresivo';const riskCopy=key==='OSCAR'?'Meta 50/50. BTC y tecnología elevan la volatilidad.':'Sin bloque defensivo identificado; vigilar NVDA y TSLA.';return `<article class="portfolio-card ${key==='JA'?'ja':''}"><div class="portfolio-head"><div class="identity"><div class="avatar">${safe(p.accountBadge||key)}</div><div><div class="name">Cartera ${key==='OSCAR'?'Óscar':'JA'}</div></div></div></div><div class="kpis4"><div class="metric"><span class="muted">Valor de la cartera</span><strong>${money.format(p.balance)}</strong><div class="change ${cls}">${number.format(p.dayChangePct)}% hoy</div></div><div class="metric"><span class="muted">Cambio diario</span><strong class="${cls}">${p.dayChange>=0?'+':''}${money.format(p.dayChange)}</strong></div><div class="metric"><span class="muted">Poder de compra</span><strong>${money.format(p.cash)}</strong></div><div class="metric"><span class="muted">Divisa base</span><strong>USD</strong></div></div><div class="allocation-risk"><section class="mini-panel"><h3>Asignación actual · meta 50 / 50</h3><div class="allocation-body"><div class="donut" style="--c1:${key==='OSCAR'?'#20b7a7':'#6541cf'};--c2:${key==='OSCAR'?'#3168e8':'#ff812c'};--pct:${safePct}%"><b>${safePct}/${growthPct}</b></div><div class="legend"><div><span>${key==='OSCAR'?'Conservador':'Defensivo'}</span><b>${safePct}%</b></div><div><span>Crecimiento</span><b>${growthPct}%</b></div><div><span>Total invertido</span><b>${money.format(total)}</b></div></div></div></section><section class="mini-panel"><h3>Riesgo</h3><div class="risk-title">♢ ${risk}</div><div class="risk-copy"><span>${riskCopy}</span><span><b>${(p.positions||[]).length}</b> posiciones registradas</span></div></section></div><section class="positions"><h3>Posiciones principales</h3><div class="table-wrap"><table><thead><tr><th>Ticker</th><th>Nombre</th><th>Peso</th><th>Precio</th></tr></thead><tbody>${positions}</tbody></table></div></section></article>`}
let currentAsOf='—';function lower(data){const latest=data.informes.cierre||data.informes.apertura;return `<section class="decision-strip"><article class="decision-box"><h3>▤ Último informe</h3><span class="report-badge">INFORME DIARIO</span><p><b>${latest?safe(latest.fecha):'Pendiente'}</b></p><p>${latest?safe(latest.resumen):'Todavía no hay un informe almacenado.'}</p></article><article class="decision-box"><h3>Noticias y catalizadores</h3><ul><li>Empleo fuerte mantiene presión sobre las tasas.</li><li>Próximo dato clave: inflación de EE. UU.</li><li>Lunes: mercado cerrado por Labor Day.</li></ul></article><article class="decision-box"><h3>Decisión sugerida</h3><p><b style="color:#3168e8">Cartera Óscar</b><br>Mantener SGOV y VOO. Vigilar BTC, PLTR y SOFI.</p><p><b style="color:#6541cf">Cartera JA</b><br>Mantener. Vigilar concentración en NVDA y TSLA.</p></article><article class="decision-box"><h3>Cronograma de informes</h3><div class="schedule-row"><b>Apertura</b><span>9:35 ET</span></div><div class="schedule-row"><b>Cierre</b><span>4:35 ET</span></div><p>Panorama, desempeño y decisiones.</p></article></section>`}
async function load(){const s=session();if(!s?.access_token)throw new Error('Inicia sesión nuevamente en AURA para ver esta información.');const res=await fetch(API,{headers:{Authorization:`Bearer ${s.access_token}`}});if(!res.ok)throw new Error(res.status===401?'Tu sesión no está autorizada o venció.':'No fue posible cargar Finanzas.');const data=await res.json();if(!data.portfolio)throw new Error('La protección está activa; falta cargar la primera foto de las carteras.');currentAsOf=new Date(data.portfolio.asOf).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});const p=data.portfolio.portfolios;document.getElementById('dashboard').innerHTML=`<div class="portfolio-grid">${portfolioCard('OSCAR',p.OSCAR)}${portfolioCard('JA',p.JA)}</div>${lower(data)}`;document.getElementById('state').hidden=true;document.getElementById('dashboard').hidden=false;document.getElementById('wa-status').textContent='● WhatsApp AURA · línea en revisión de Meta'}
load().catch(err=>{document.getElementById('state').innerHTML=`<div><div class="lock-icon">🔒</div><h2>Acceso privado protegido</h2><p class="error">${safe(err.message)}</p><button onclick="location.reload()">Intentar nuevamente</button></div>`});
</script></body></html>
