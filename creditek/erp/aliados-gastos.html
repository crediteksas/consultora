<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KORA · Gastos Aliados</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="aliados-v1-1.css" />
    <link rel="stylesheet" href="/design-system/components/kora-product.css" />
    <script src="/creditek/erp/supabase-js-2.110.8.js"></script>
    <script src="/config/kora-environment.generated.js"></script>
    <script src="kora-access-control.js?v=2.0.32"></script>
    <script src="sidebar.js?v=2.0.32" data-kora-shell="1.0.0"></script>
    <script src="/design-system/components/kora-product.js" defer></script>
  </head>
  <body data-kora-requires-auth="true" data-aliados-view="expenses">
    <div id="app">
      <div id="accessDenied" class="denied hidden">
        <div>
          <h2>Acceso denegado</h2>
          <p>No tienes permiso para administrar gastos de Aliados.</p>
        </div>
      </div>
      <main id="pageContent" class="main-content hidden">
        <div class="page">
          <header class="head">
            <div>
              <h1>Gastos de Aliados</h1>
              <div class="subtitle">
                Costos adicionales de la operación, con soporte, aprobación y
                trazabilidad.
              </div>
            </div>
          </header>
          <div id="notice" class="notice hidden"></div>
          <form id="expenseForm" class="card form-grid">
            <label
              >Fecha<input
                id="expenseDate"
                class="control"
                type="date"
                required /></label
            ><label
              >Plataforma<select id="expensePlatform" class="control">
                <option value="">General</option>
                <option value="payjoy">PayJoy</option>
                <option value="alo">ALO Credit</option>
                <option value="krediya">Krediya</option>
              </select></label
            ><label
              >Establecimiento<select id="expenseOrigin" class="control">
                <option value="">General</option>
              </select></label
            ><label
              >Concepto<input
                id="expenseConcept"
                class="control"
                required
                placeholder="Ej. transporte, comisión bancaria" /></label
            ><label
              >Valor<input
                id="expenseValue"
                class="control"
                type="number"
                min="1"
                step="1"
                required /></label
            ><label
              >Beneficiario del pago<input
                id="expenseBeneficiary"
                class="control"
                required
                placeholder="Persona o empresa que recibirá el pago" /></label
            ><label
              >CC / NIT del beneficiario<input
                id="expenseDocument"
                class="control"
                required
                minlength="5"
                placeholder="Identificación del titular" /></label
            ><label
              >Banco o billetera<select id="expenseBank" class="control" required>
                <option value="">Selecciona</option>
                <option>Bancolombia</option><option>Nequi</option><option>Daviplata</option>
                <option>Davivienda</option><option>Banco de Bogotá</option><option>BBVA</option>
                <option value="Otro">Otro</option>
              </select></label
            ><label
              >Nombre del banco (si elegiste Otro)<input id="expenseOtherBank" class="control" /></label
            ><label
              >Tipo de cuenta<select id="expenseAccountType" class="control" required>
                <option value="">Selecciona</option><option>Ahorros</option>
                <option>Corriente</option><option>Billetera digital</option>
              </select></label
            ><label
              >Número de cuenta o celular<input
                id="expenseAccount"
                class="control"
                required
                inputmode="numeric"
                pattern="[0-9]{6,20}"
                maxlength="20"
                placeholder="Solo dígitos" /></label
            ><label
              >Soporte del gasto<input
                id="expenseSupport"
                class="control"
                type="file"
                accept="image/jpeg,image/png,application/pdf" /></label
            ><label class="span-2"
              >Descripción<textarea
                id="expenseDescription"
                class="control"
                rows="3"
              ></textarea>
            </label>
            <div class="span-2 actions">
              <button class="btn primary" type="submit">Registrar gasto</button>
            </div>
          </form>
          <section id="metrics" class="metrics section"></section>
          <section id="content"></section>
        </div>
      </main>
    </div>
    <script src="aliados-reversiones-domain.js?v=1"></script><script src="payment-destination.js?v=1.0.0"></script><script src="aliados-v1-1-app.js?v=1.1.31"></script>
  </body>
</html>
