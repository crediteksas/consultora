<!doctype html>
<html lang="es" data-kora-version="2.0.1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KORA · Mis reportes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="sidebar.js" data-kora-shell="1.0.0"></script>
  <link rel="stylesheet" href="/design-system/components/kora-product.css">
  <script src="/design-system/components/kora-product.js" defer></script>
  <script src="incidencias-app.js" defer></script>
</head>
<body data-incident-mode="own" data-kora-requires-auth="true">
<div id="app" class="hidden">
  <main class="main-content">
    <section class="kora-incidents-page">
      <header><p>Soporte</p><h1>Mis reportes</h1><p>Consulta el estado y agrega información a tus incidencias.</p></header>
      <section class="kora-incidents-panel"><div class="kora-incidents-table-wrap"><table class="kora-incidents-table"><thead><tr><th>Código</th><th>Fecha</th><th>Título</th><th>Módulo</th><th>Prioridad</th><th>Estado</th><th>Última actualización</th></tr></thead><tbody data-incident-list><tr><td colspan="7">Cargando…</td></tr></tbody></table></div>
      <div class="kora-incident-detail" data-incident-detail hidden><h2 data-detail-title></h2><div data-detail-content></div><h3>Historial</h3><ol class="kora-incident-timeline" data-incident-history></ol><h3>Respuestas</h3><div data-incident-comments></div><label>Agregar información<textarea data-comment-text aria-label="Agregar información"></textarea></label><label>Agregar evidencia<input type="file" data-comment-evidence aria-label="Agregar evidencia" accept=".png,.jpg,.jpeg,.webp,.pdf,image/png,image/jpeg,image/webp,application/pdf"></label><button type="button" data-incident-add-comment>Enviar comentario</button><button type="button" data-incident-confirm-fixed>Confirmar que quedó corregido</button></div></section>
      <p role="status" data-incident-page-status></p>
    </section>
  </main>
</div>
</body>
</html>
