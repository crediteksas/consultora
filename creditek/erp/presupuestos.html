<html lang="es">

<style>
:root {
  --azul: #0B1E3D; --turquesa: #00C4CC; --bg: #F5F5F7; --surface: #FFFFFF;
  --border: rgba(11,30,61,0.08); --text2: #6E6E76; --verde: #16A34A; --amarillo: #D97706; --rojo: #DC2626;
  --radius: 18px; --radius-sm: 11px;
  --shadow-sm: 0 1px 2px rgba(11,30,61,0.04), 0 1px 1px rgba(11,30,61,0.03);
  --shadow-md: 0 12px 28px -10px rgba(11,30,61,0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--azul); -webkit-font-smoothing: antialiased; }

.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 30% 20%, #EAFBFC 0%, var(--bg) 55%); }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 40px 32px; width: 100%; max-width: 360px; box-shadow: var(--shadow-md); }
.login-box img.logo { display: block; height: 40px; margin: 0 auto 22px; object-fit: contain; }
.login-box input { width: 100%; border: 1px solid transparent; background: var(--bg); border-radius: var(--radius-sm); padding: 13px 14px; font-size: 15px; margin-bottom: 12px; font-family: inherit; transition: all .15s ease; }
.login-box input:focus { outline: none; background: white; border-color: var(--turquesa); box-shadow: 0 0 0 4px rgba(0,196,204,0.14); }
.login-box button { width: 100%; background: var(--turquesa); color: white; border: none; border-radius: var(--radius-sm); padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 6px; box-shadow: 0 6px 16px -4px rgba(0,196,204,0.5); transition: transform .12s ease, box-shadow .12s ease; }
.login-box button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px -4px rgba(0,196,204,0.55); }
.login-box button:disabled { background: #D2D2D7; box-shadow: none; }
.login-err { color: var(--rojo); font-size: 12.5px; margin-top: 10px; display: none; }
.login-err.show { display: block; }

.sin-perfil-screen { min-height: 100vh; display: none; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.sin-perfil-screen.show { display: flex; }
.sin-perfil-box { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 40px 32px; max-width: 380px; box-shadow: var(--shadow-md); }
.sin-perfil-box .icono { font-size: 34px; margin-bottom: 12px; }
.sin-perfil-box h2 { font-family: 'Montserrat', sans-serif; font-size: 17px; margin-bottom: 8px; }
.sin-perfil-box p { font-size: 13.5px; color: var(--text2); line-height: 1.5; margin-bottom: 18px; }
.sin-perfil-box button { border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 10px 18px; font-size: 13px; cursor: pointer; color: var(--azul); font-weight: 600; }

#app { display: none; }
#app.show { display: flex; }

.page { max-width: 1280px; margin: 0 auto; padding: 32px 24px 60px; }
.page-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.page-top h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.acceso-negado { text-align: center; padding: 80px 20px; color: var(--text2); }
.acceso-negado .icono { font-size: 34px; margin-bottom: 12px; }

.btn-primary { background: var(--turquesa); color: white; border: none; border-radius: 999px; padding: 11px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 16px -4px rgba(0,196,204,0.5); transition: transform .12s ease; }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
.btn-primary:disabled { background: #D2D2D7; box-shadow: none; cursor: not-allowed; }
.btn-secundario { background: var(--bg); color: var(--azul); border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

.banner-ok {
  position: sticky; top: 14px; z-index: 8; margin: 0 auto 18px; max-width: 1280px;
  background: #DCFCE7; color: #166534; border: 1px solid #86EFAC; border-radius: var(--radius-sm);
  padding: 13px 18px; font-size: 13.5px; font-weight: 700; display: none; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-sm);
}
.banner-ok.show { display: flex; }
.banner-ok button { background: none; border: none; color: #166534; font-weight: 700; cursor: pointer; font-size: 16px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }
.card h2 { font-family: 'Montserrat', sans-serif; font-size: 15px; margin-bottom: 4px; }
.card .sub { font-size: 12.5px; color: var(--text2); margin-bottom: 14px; }
.form-inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.campo { margin-bottom: 0; }
.campo label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 600; }
.campo input, .campo select { border: 1px solid transparent; background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13.5px; font-family: inherit; transition: all .15s ease; }
.campo input:focus, .campo select:focus { outline: none; background: white; border-color: var(--turquesa); box-shadow: 0 0 0 3px rgba(0,196,204,0.12); }
.modal-err { color: var(--rojo); font-size: 12.5px; margin-top: 8px; display: none; }
.modal-err.show { display: block; }
.modal-ok { color: var(--verde); font-size: 12.5px; margin-top: 8px; display: none; }
.modal-ok.show { display: block; }

.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tabs button { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--text2); }
.tabs button.activo { background: var(--azul); color: white; border-color: var(--azul); }

.tabla-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow-sm); max-height: 65vh; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: center; padding: 8px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: rgba(11,30,61,0.02); font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--text2); font-weight: 700; position: sticky; top: 0; z-index: 2; }
td.tienda-nombre, th.tienda-nombre { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; font-weight: 700; min-width: 140px; }
th.tienda-nombre { z-index: 3; background: rgba(11,30,61,0.04); }
td.total-mes, th.total-mes { position: sticky; right: 0; background: var(--surface); font-weight: 700; z-index: 1; }
th.total-mes { z-index: 3; background: rgba(11,30,61,0.04); }
/* Las columnas fijas deben tapar los días que pasan por detrás, también al resaltar la fila. */
#tablaPresupuesto tbody td:is(.tienda-nombre, .total-mes) { background: var(--surface); }
#tablaPresupuesto tbody tr:hover td:is(.tienda-nombre, .total-mes) { background: #f6fdfd; }
#tablaPresupuesto tfoot td { background: #eaf8f9; font-weight: 700; border-top: 2px solid var(--turquesa); }
.totales-mes { margin-bottom: 16px; }
.totales-mes h2 { font-size: 14px; margin-bottom: 10px; }
.totales-mes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.total-indicador { padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); min-width: 0; }
.total-indicador span { display: block; font-size: 12px; color: var(--text2); }
.total-indicador strong { display: block; margin-top: 6px; font-size: 18px; overflow-wrap: anywhere; }
td.dia-celda { cursor: pointer; }
td.dia-celda:hover { background: rgba(0,196,204,0.08); }
td.finde { background: rgba(11,30,61,0.02); }
td.manual { color: var(--turquesa); font-weight: 700; }
.celda-input { width: 42px; text-align: center; border: 1px solid var(--turquesa); border-radius: 6px; padding: 3px; font-size: 12.5px; font-family: inherit; }
.porcentajes-grid { display:grid; grid-template-columns:repeat(4,minmax(120px,1fr)); gap:10px; width:100%; margin-top:10px; }
.porcentajes-grid input { width:100%; }
@media (max-width:900px) { .porcentajes-grid { grid-template-columns:repeat(2,minmax(140px,1fr)); } }
@media (max-width:520px) { .porcentajes-grid { grid-template-columns:1fr; } }
.empty-state { text-align: center; color: var(--text2); font-size: 14px; padding: 40px 0; }
.cartas-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:24px; margin-top:16px; }
.carta-preview { border:1px solid #dbe7eb; border-radius:14px; padding:18px; background:#f9fdfd; }
.carta-preview h3 { font:700 15px 'Montserrat',sans-serif; margin-bottom:6px; }
.carta-preview p { color:var(--text2); font-size:12px; line-height:1.5; margin-bottom:10px; }
.carta-preview dl { display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:12px; margin-bottom:14px; }
.carta-preview dt { color:var(--text2); }.carta-preview dd { font-weight:700; text-align:right; }
.carta-preview .btn-secundario { width:100%; }
.premio-editor { margin:12px 0 20px; padding:16px; background:#eef7f6; border:1px solid #cde3df; border-radius:10px; }
.premio-campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0; }
.premio-campos label { display:flex;flex-direction:column;gap:6px;font-size:12px; }
.premio-campos input { min-width:0;padding:10px;border:1px solid #bdcfcd;border-radius:7px; }
#cartasPresupuesto { scroll-margin-top: 90px; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(11,30,61,0.35); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-bg.show { display: flex; }
.modal-box { background: var(--surface); border-radius: 20px; padding: 26px 24px; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-md); }
.modal-box h2 { font-family: 'Montserrat', sans-serif; font-size: 17px; margin-bottom: 4px; }
.modal-sub { font-size: 12.5px; color: var(--text2); margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.modal-actions button { flex: 1; border: none; border-radius: 999px; padding: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.modal-actions .btn-cancelar { background: var(--bg); color: var(--text2); flex: 0 0 auto; padding: 12px 20px; }
.modal-actions .btn-guardar { background: var(--turquesa); color: white; }
</style>
<link rel="stylesheet" href="/design-system/components/kora-product.css">
<script src="/design-system/components/kora-product.js" defer></script>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img class="logo" src="/creditek/shared/branding/creditek-logo.png" alt="Creditek">
    <input type="email" id="loginEmail" placeholder="Correo" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
    <button id="btnLogin">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="sin-perfil-screen" id="sinPerfilScreen">
  <div class="sin-perfil-box">
    <div class="icono">🔒</div>
    <h2>Sin perfil asignado</h2>
    <p>Tu usuario no tiene perfil asignado. Contacta al administrador.</p>
    <button id="btnSalirSinPerfil">Cerrar sesión</button>
  </div>
</div>

<div id="app">
  <div style="display:none;" aria-hidden="true">
    <b id="navNombre"></b><span id="navRolTienda"></span><button id="btnLogout"></button>
  </div>
  <div class="main-content">

  <div class="banner-ok" id="bannerOk">
    <span id="bannerOkTexto"></span>
    <button id="btnCerrarBanner">✕</button>
  </div>

  <div class="page" id="pageContenido"></div>
  </div>
</div>

<template id="tplAccesoNegado">
  <div class="acceso-negado">
    <div class="icono">🔒</div>
    <h2>Solo gerencia o auditoría</h2>
    <p>Los presupuestos no están disponibles para roles de tienda.</p>
  </div>
</template>

<template id="tplPresupuestos">
  <div class="page-top">
    <h1>Presupuesto de Retail</h1>
  </div>

  <div class="card">
    <h2>Planificar presupuesto por tienda</h2>
    <div class="sub">Selecciona una tienda o todas las tiendas activas y la categoría en las pestañas. KORA reparte el total mensual uniformemente entre todos los días del mes, conservando el total exacto. Un reparto según ventas diarias solo se usará cuando exista un histórico diario real verificado. El porcentaje se aplica únicamente como propuesta y nada se guarda hasta que lo apruebes.</div>
    <div class="form-inline">
      <div class="campo"><label>Tienda</label><select id="genTienda"><option value="">Selecciona una tienda</option><option value="__todas__">Todas las tiendas activas</option></select></div>
      <div class="campo"><label>Mes</label><input type="month" id="genMes"></div>
      <button class="btn-primary" id="btnGenerar">Calcular propuesta</button>
      <button class="btn-primary" id="btnAprobarPropuesta" style="display:none;">Aprobar indicador actual</button>
      <button class="btn-primary" id="btnAprobarTodo">Aprobar los 4 indicadores</button>
      <button class="btn-secundario" id="btnGenerarCartas">Generar presupuestos</button>
      <button class="btn-secundario" id="btnDescargarCartas">Descargar todas las cartas (ZIP)</button>
      <button class="btn-secundario" id="btnCancelarPropuesta" style="display:none;">Descartar</button>
      <button class="btn-secundario" id="btnImportarHistorico">Importar histórico (CSV)</button>
      <input type="file" id="inputHistorico" accept=".csv,.xlsx,.xls" style="display:none;">
    </div>
    <div class="porcentajes-grid">
      <div class="campo"><label>Ventas</label><input class="pct-metrica" data-metrica="meta_venta_total" type="number" value="0" min="0" max="1000" step="1"></div>
      <div class="campo"><label>Créditos</label><input class="pct-metrica" data-metrica="meta_creditos" type="number" value="0" min="0" max="1000" step="1"></div>
      <div class="campo"><label>Celulares contado</label><input class="pct-metrica" data-metrica="meta_uds_cel" type="number" value="0" min="0" max="1000" step="1"></div>
      <div class="campo"><label>Accesorios</label><input class="pct-metrica" data-metrica="meta_uds_acc" type="number" value="0" min="0" max="1000" step="1"></div>
    </div>
    <small id="genPctAyuda">Cada indicador conserva su propio porcentaje. 100% significa duplicar el resultado anterior.</small>
    <div class="modal-err" id="genErr"></div>
  </div>

  <section class="card" id="cartasPresupuesto" hidden aria-live="polite">
    <h2>Cartas de presupuesto por tienda</h2>
    <div class="sub">Cada carta usa únicamente metas registradas en KORA; puedes abrirla y guardarla como PDF para enviarla al administrador. No se envía automáticamente.</div>
    <div id="cartasEstado"></div>
    <div id="premioMensual"></div>
    <div class="cartas-grid" id="cartasGrid"></div>
  </section>

  <div class="tabs">
    <button id="tabVentas" data-metrica="meta_venta_total">Ventas</button>
    <button class="activo" id="tabCreditos" data-metrica="meta_creditos">Créditos</button>
    <button id="tabCelulares" data-metrica="meta_uds_cel">Celulares (contado)</button>
    <button id="tabAccesorios" data-metrica="meta_uds_acc">Accesorios</button>
  </div>

  <div class="form-inline" style="margin-bottom:12px;">
    <div class="campo"><label>Mes a ver</label><input type="month" id="verMes"></div>
  </div>

  <section id="totalesMes" class="totales-mes" aria-live="polite" hidden>
    <h2 id="totalesMesTitulo">Presupuesto total del mes · todas las tiendas</h2>
    <div id="totalesMesValores" class="totales-mes-grid"></div>
  </section>

  <div class="tabla-wrap">
    <table id="tablaPresupuesto">
      <thead><tr id="theadFila"></tr></thead>
      <tbody id="tbodyPresupuesto"></tbody>
      <tfoot id="tfootPresupuesto"></tfoot>
    </table>
    <p id="avisoHistoricoAccesorios" role="status" class="sub"></p>
    <div class="empty-state" id="emptyPresupuesto" style="display:none;">No hay presupuesto generado para este mes todavía.</div>
  </div>
</template>

<!-- Modal: editar celda -->
<div class="modal-bg" id="modalCelda">
  <div class="modal-box">
    <h2>Ajustar meta</h2>
    <div class="modal-sub" id="celdaContexto"></div>
    <div class="campo"><label id="celdaLabel">Meta</label><input type="number" id="celdaValor" min="0"></div>
    <div class="modal-err" id="celdaErr"></div>
    <div class="modal-actions">
      <button class="btn-cancelar" id="btnCancelarCelda">Cancelar</button>
      <button class="btn-guardar" id="btnGuardarCelda">Guardar</button>
    </div>
  </div>
</div>

<script>
const KORA_ENV = window.__KORA_ENV__;
const SUPABASE_URL = KORA_ENV.KORA_ERP_SUPABASE_URL;
const SUPABASE_ANON_KEY = KORA_ENV.KORA_ERP_SUPABASE_ANON_KEY;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentPerfil = null;
let tiendasCache = [];
let presupuestoCache = [];
let metricaActual = 'meta_creditos';
let celdaEnEdicion = null;
let propuestaActual = null;
let cartasActuales = new Map();

function esCentral() { return !!currentPerfil && (currentPerfil.rol === 'gerencia' || currentPerfil.rol === 'auditoria'); }

document.getElementById('btnLogin').addEventListener('click', hacerLogin);
document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') hacerLogin(); });

async function hacerLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('loginErr');
  err.classList.remove('show');
  if (!email || !password) return;
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) { err.textContent = 'Correo o contraseña incorrectos.'; err.classList.add('show'); return; }
  entrarApp(data.user);
}

document.getElementById('btnLogout').addEventListener('click', cerrarSesion);
document.getElementById('btnSalirSinPerfil').addEventListener('click', cerrarSesion);
async function cerrarSesion() { await sb.auth.signOut(); location.reload(); }

async function entrarApp(user) {
  currentUser = user;
  const { data: perfil, error } = await sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !perfil || !perfil.activo) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('sinPerfilScreen').classList.add('show');
    return;
  }
  currentPerfil = perfil;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  pintarNavUser();
  initPagina();
}

function pintarNavUser() {
  document.getElementById('navNombre').textContent = currentPerfil.nombre || currentUser.email;
  const rolLabel = { gerencia: 'Gerencia', auditoria: 'Auditoría', admin_tienda: 'Admin tienda', asesor: 'Asesor' }[currentPerfil.rol] || currentPerfil.rol;
  document.getElementById('navRolTienda').textContent = currentPerfil.tienda_codigo ? `${rolLabel} · ${currentPerfil.tienda_codigo}` : rolLabel;
}

sb.auth.getSession().then(({ data }) => { if (data.session) entrarApp(data.session.user); });

function fmtCOP(n) { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(n || 0); }
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function mostrarBanner(texto) {
  document.getElementById('bannerOkTexto').textContent = texto;
  document.getElementById('bannerOk').classList.add('show');
}
document.getElementById('btnCerrarBanner').addEventListener('click', () => document.getElementById('bannerOk').classList.remove('show'));

function initPagina() {
  if (!esCentral()) {
    document.getElementById('pageContenido').innerHTML = '';
    document.getElementById('pageContenido').appendChild(document.getElementById('tplAccesoNegado').content.cloneNode(true));
    return;
  }
  const cont = document.getElementById('pageContenido');
  cont.innerHTML = '<nav data-presupuestos-negocios></nav>';
  window.KoraPresupuestosNav.montar(cont.firstElementChild, currentPerfil);
  if (window.KoraPresupuestosNav.negocioActual(location) === 'b2b') {
    const b2b = document.createElement('section');
    cont.appendChild(b2b);
    return window.KoraPresupuestoB2B.montar(b2b, { sb, perfil: currentPerfil });
  }
  cont.appendChild(document.getElementById('tplPresupuestos').content.cloneNode(true));

  const hoy = new Date();
  const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
  document.getElementById('genMes').value = mesActual;
  document.getElementById('verMes').value = mesActual;
  if (currentPerfil.rol !== 'gerencia') document.getElementById('btnAprobarTodo').style.display = 'none';

  document.getElementById('btnGenerar').addEventListener('click', generarPresupuesto);
  document.getElementById('btnAprobarTodo').addEventListener('click', guardarTodosLosIndicadores);
  document.getElementById('btnGenerarCartas').addEventListener('click', generarCartasPresupuesto);
  document.getElementById('btnDescargarCartas').addEventListener('click', descargarTodasCartas);
  document.querySelectorAll('.pct-metrica').forEach(input => input.addEventListener('input', actualizarAyudaCrecimiento));
  document.getElementById('btnAprobarPropuesta').addEventListener('click', guardarPropuesta);
  document.getElementById('btnCancelarPropuesta').addEventListener('click', descartarPropuesta);
  document.getElementById('btnImportarHistorico').addEventListener('click', () => document.getElementById('inputHistorico').click());
  document.getElementById('inputHistorico').addEventListener('change', importarHistorico);
  document.getElementById('verMes').addEventListener('change', cargarPresupuesto);
  document.getElementById('genTienda').addEventListener('change', () => {
    if (propuestaActual) descartarPropuesta();
    document.getElementById('cartasPresupuesto').hidden = true;
  });
  document.getElementById('genMes').addEventListener('change', () => {
    if (propuestaActual) descartarPropuesta();
    document.getElementById('cartasPresupuesto').hidden = true;
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => cambiarTab(b)));

  cargarTiendas().then(cargarPresupuesto);
  actualizarAyudaCrecimiento();
}

function actualizarAyudaCrecimiento() {
  const input = document.querySelector(`.pct-metrica[data-metrica="${metricaActual}"]`);
  const ayuda = document.getElementById('genPctAyuda');
  if (!input || !ayuda) return;
  const pct = Number(input.value);
  ayuda.textContent = Number.isFinite(pct) && pct >= 0
    ? `${pct}% de crecimiento = ${(1 + pct / 100).toLocaleString('es-CO', { maximumFractionDigits: 2 })} veces la venta anterior`
    : 'Ingresa un crecimiento entre 0% y 1000%';
}

function leerPorcentaje(metrica) {
  return Number(document.querySelector(`.pct-metrica[data-metrica="${metrica}"]`)?.value ?? 0);
}

function porcentajesValidos() {
  return [...document.querySelectorAll('.pct-metrica')].every(input => {
    const valor = Number(input.value);
    return Number.isFinite(valor) && valor >= 0 && valor <= 1000;
  });
}

async function cargarTiendas() {
  tiendasCache = await CreditekTiendasCanonicas.cargar(sb);
  const selector = document.getElementById('genTienda');
  if (selector) selector.innerHTML = '<option value="">Selecciona una tienda</option><option value="__todas__">Todas las tiendas activas</option>' + tiendasCache.map(t => `<option value="${escapeHtml(t.codigo)}">${escapeHtml(t.nombre)}</option>`).join('');
}

function cambiarTab(btn) {
  if (propuestaActual) descartarPropuesta();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('activo'));
  btn.classList.add('activo');
  metricaActual = btn.dataset.metrica;
  actualizarAyudaCrecimiento();
  renderTabla();
}

async function generarPresupuesto() {
  const err = document.getElementById('genErr');
  err.classList.remove('show');
  const mesStr = document.getElementById('genMes').value;
  const seleccion = document.getElementById('genTienda').value;
  const pct = leerPorcentaje(metricaActual);
  let tiendas;
  try { tiendas = KoraPresupuestosRetailCartas.tiendasElegidas(tiendasCache, seleccion); }
  catch (ex) { err.textContent = ex.message; err.classList.add('show'); return; }
  if (!mesStr) { err.textContent = 'Selecciona un mes.'; err.classList.add('show'); return; }
  if (!Number.isFinite(pct) || pct < 0 || pct > 1000) {
    err.textContent = 'El crecimiento debe estar entre 0% y 1000%. Ejemplo: 150% produce una meta equivalente a 2,5 veces la venta anterior.';
    err.classList.add('show');
    return;
  }
  const btn = document.getElementById('btnGenerar');
  btn.disabled = true; btn.textContent = 'Calculando...';
  let filas = [];
  try {
    const resultados = await Promise.all(tiendas.map(async tienda => {
      const { data, error } = await sb.rpc('proponer_presupuesto_operativo', {
        p_tienda: tienda.codigo, p_mes: mesStr + '-01', p_metrica: metricaActual, p_pct_crecimiento: pct
      });
      if (error) throw new Error(`${tienda.nombre}: ${error.message}`);
      return (data || []).map(f => ({ ...f, tienda_codigo: tienda.codigo }));
    }));
    filas = resultados.flat();
  } catch (ex) {
    err.textContent = 'No se pudo calcular la propuesta completa: ' + ex.message;
    err.classList.add('show');
    return;
  } finally {
    btn.disabled = false; btn.textContent = 'Calcular propuesta';
  }
  if (filas.some(f => Number(f.meta_propuesta) < 0)) {
    err.textContent = 'KORA detuvo la propuesta porque produjo un valor negativo. No se guardó ningún cambio.';
    err.classList.add('show');
    return;
  }
  propuestaActual = { tiendas: tiendas.map(t => t.codigo), mesStr, pct, metrica: metricaActual, filas };
  document.getElementById('verMes').value = mesStr;
  await cargarPresupuesto();
  aplicarPropuestaEnVista();
  document.getElementById('btnAprobarPropuesta').style.display = currentPerfil.rol === 'gerencia' ? '' : 'none';
  document.getElementById('btnCancelarPropuesta').style.display = '';
  const fuente = propuestaActual.filas[0]?.fuente || 'sin histórico';
  const siguiente = currentPerfil.rol === 'gerencia' ? 'Revisa los días y pulsa “Aprobar indicador actual”.' : 'Vista previa: la aprobación corresponde a Gerencia.';
  mostrarBanner(`Propuesta para ${tiendas.length} tienda(s), sin guardar: ${fuente}, crecimiento ${pct}%. ${siguiente}`);
}

function aplicarPropuestaEnVista() {
  if (!propuestaActual) return;
  propuestaActual.filas.forEach(f => {
    let reg = presupuestoCache.find(p => p.tienda_codigo === f.tienda_codigo && p.fecha === f.fecha);
    if (!reg) {
      reg = { tienda_codigo: f.tienda_codigo, fecha: f.fecha, meta_creditos: 0, meta_uds_cel: 0, meta_uds_acc: 0, meta_venta_total: 0 };
      presupuestoCache.push(reg);
    }
    reg[propuestaActual.metrica] = Number(f.meta_propuesta || 0);
    reg.generado_desde = 'propuesta_sin_guardar';
  });
  renderTabla();
}

async function guardarTodosLosIndicadores() {
  const err = document.getElementById('genErr');
  err.classList.remove('show');
  const seleccion = document.getElementById('genTienda').value;
  const mesStr = document.getElementById('genMes').value;
  let tiendas;
  try { tiendas = KoraPresupuestosRetailCartas.tiendasElegidas(tiendasCache, seleccion); }
  catch (ex) { err.textContent = ex.message; err.classList.add('show'); return; }
  if (!mesStr) { err.textContent = 'Selecciona un mes.'; err.classList.add('show'); return; }
  if (!porcentajesValidos()) { err.textContent = 'Todos los porcentajes deben estar entre 0% y 1000%.'; err.classList.add('show'); return; }
  if (currentPerfil.rol !== 'gerencia') { err.textContent = 'Solo Gerencia puede aprobar presupuestos.'; err.classList.add('show'); return; }
  if (tiendas.length > 1 && !confirm(`¿Aprobar los cuatro indicadores para ${tiendas.length} tiendas? Cada tienda se guarda por separado.`)) return;
  const btn = document.getElementById('btnAprobarTodo');
  btn.disabled = true; btn.textContent = 'Guardando los 4...';
  const aprobadas = [], fallidas = [];
  for (const tienda of tiendas) {
    try {
      const { error } = await sb.rpc('guardar_presupuesto_operativo_general', {
        p_tienda: tienda.codigo, p_mes: mesStr + '-01',
        p_pct_ventas: leerPorcentaje('meta_venta_total'),
        p_pct_creditos: leerPorcentaje('meta_creditos'),
        p_pct_celulares: leerPorcentaje('meta_uds_cel'),
        p_pct_accesorios: leerPorcentaje('meta_uds_acc')
      });
      if (error) throw error;
      aprobadas.push(tienda.nombre);
    } catch (ex) {
      fallidas.push(`${tienda.nombre}: ${ex.message || 'sin confirmación del guardado'}`);
    }
  }
  btn.disabled = false; btn.textContent = 'Aprobar los 4 indicadores';
  propuestaActual = null;
  document.getElementById('btnAprobarPropuesta').style.display = 'none';
  document.getElementById('btnCancelarPropuesta').style.display = 'none';
  await cargarPresupuesto();
  if (fallidas.length) {
    err.textContent = `Se aprobaron ${aprobadas.length} tienda(s). No se aprobaron ${fallidas.length}: ${fallidas.join('; ')}. Revisa antes de volver a intentar.`;
    err.classList.add('show');
  } else mostrarBanner(`Los cuatro indicadores quedaron aprobados para ${aprobadas.length} tienda(s).`);
}

async function guardarPropuesta() {
  if (!propuestaActual) return;
  const btn = document.getElementById('btnAprobarPropuesta');
  const err = document.getElementById('genErr');
  const tiendas = propuestaActual.tiendas.map(codigo => tiendasCache.find(t => t.codigo === codigo)).filter(Boolean);
  if (tiendas.length > 1 && !confirm(`¿Aprobar ${metricaActual} para ${tiendas.length} tiendas? Cada tienda se guarda por separado.`)) return;
  btn.disabled = true; btn.textContent = 'Guardando...';
  const aprobadas = [], fallidas = [];
  for (const tienda of tiendas) {
    try {
      const { error } = await sb.rpc('guardar_presupuesto_operativo', {
        p_tienda: tienda.codigo, p_mes: propuestaActual.mesStr + '-01',
        p_metrica: propuestaActual.metrica, p_pct_crecimiento: propuestaActual.pct
      });
      if (error) throw error;
      aprobadas.push(tienda.nombre);
    } catch (ex) {
      fallidas.push(`${tienda.nombre}: ${ex.message || 'sin confirmación del guardado'}`);
    }
  }
  btn.disabled = false; btn.textContent = 'Aprobar indicador actual';
  propuestaActual = null;
  document.getElementById('btnAprobarPropuesta').style.display = 'none';
  document.getElementById('btnCancelarPropuesta').style.display = 'none';
  await cargarPresupuesto();
  if (fallidas.length) {
    err.textContent = `Se aprobaron ${aprobadas.length} tienda(s). Fallaron ${fallidas.length}: ${fallidas.join('; ')}. Revisa antes de volver a intentar.`;
    err.classList.add('show');
  } else mostrarBanner(`Presupuesto aprobado y guardado para ${aprobadas.join(', ')}.`);
}

async function descartarPropuesta() {
  propuestaActual = null;
  const aprobar = document.getElementById('btnAprobarPropuesta');
  const cancelar = document.getElementById('btnCancelarPropuesta');
  if (aprobar) aprobar.style.display = 'none';
  if (cancelar) cancelar.style.display = 'none';
  await cargarPresupuesto();
}

async function generarCartasPresupuesto(opciones = {}) {
  const err = document.getElementById('genErr');
  const seccion = document.getElementById('cartasPresupuesto');
  const estado = document.getElementById('cartasEstado');
  const grid = document.getElementById('cartasGrid');
  const mes = document.getElementById('genMes').value;
  let tiendas;
  err.classList.remove('show');
  try {
    tiendas = KoraPresupuestosRetailCartas.tiendasElegidas(tiendasCache, opciones.todas ? '__todas__' : document.getElementById('genTienda').value);
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(mes)) throw new Error('Selecciona un mes válido.');
  } catch (ex) {
    err.textContent = ex.message; err.classList.add('show'); return;
  }
  const btn = document.getElementById('btnGenerarCartas');
  document.getElementById('btnDescargarCartas').disabled = true;
  btn.disabled = true; btn.textContent = 'Preparando cartas...';
  try {
    const [anio, numeroMes] = mes.split('-').map(Number);
    const fin = new Date(Date.UTC(anio, numeroMes, 1)).toISOString().slice(0, 10);
    const filas = [];
    for (let inicio = 0; ; inicio += 1000) {
      const { data, error } = await sb.from('presupuestos')
        .select('tienda_codigo,fecha,meta_venta_total,meta_creditos,meta_uds_cel,meta_uds_acc')
        .gte('fecha', mes + '-01').lt('fecha', fin).range(inicio, inicio + 999);
      if (error) throw error;
      filas.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
    const adminsResult = await sb.from('perfiles').select('nombre,tienda_codigo')
      .eq('rol', 'admin_tienda').eq('activo', true);
    if (adminsResult.error) throw new Error('No se pudo consultar el administrador de cada tienda: ' + adminsResult.error.message);
    const [premiosResult, historicoResult] = await Promise.all([
      sb.from('presupuesto_premio_mensual').select('*').eq('mes', mes + '-01'),
      sb.from('historico_mensual').select('tienda_codigo,acc_uds,acc_venta').eq('anio', anio - 1).eq('mes', numeroMes)
    ]);
    if (premiosResult.error) throw new Error('No se pudieron cargar las estrategias guardadas: ' + premiosResult.error.message);
    if (historicoResult.error) throw new Error('No se pudo verificar la cantidad histórica de accesorios: ' + historicoResult.error.message);
    let premioMensualActual = (premiosResult.data || [])[0] || null;
    const cartas = tiendas.map(t => {
      const carta = KoraPresupuestosRetailCartas.resumen(t, mes, filas, adminsResult.data || []);
      carta.premio = premioMensualActual;
      const historico = (historicoResult.data || []).find(h => h.tienda_codigo === t.codigo);
      carta.accesoriosPendientes = carta.totales.meta_uds_acc === 0 && Number(historico?.acc_venta) > 0 && !(Number(historico?.acc_uds) > 0);
      return carta;
    });
    cartasActuales = new Map(cartas.map(c => [c.tienda.codigo, c]));
    const incompletas = cartas.filter(c => !c.completo);
    estado.textContent = `${cartas.length - incompletas.length} carta(s) completas en esta pantalla. Puedes revisar cada una y usar su botón Imprimir / guardar PDF.` +
      (incompletas.length ? ` ${incompletas.length} tienda(s) aún no tienen todos los días del presupuesto registrado.` : '');
    const premioContenedor = document.getElementById('premioMensual');
    premioContenedor.innerHTML = currentPerfil.rol === 'gerencia' ? `<div class="premio-editor">
      <h3>Estrategia mensual para todas las tiendas Retail</h3>
      <p>Configúrala una sola vez para ${escapeHtml(mes)}. Al guardar, se reflejará en todas las cartas del mes, incluso si ahora ves una sola tienda.</p>
      <form id="premioMensualForm">
        <label><input type="checkbox" name="activo" ${premioMensualActual?.activo ? 'checked' : ''}> Mostrar premio en todas las cartas</label>
        <div class="premio-campos">
          <label>Nombre de la estrategia<input name="estrategia" maxlength="120" required value="${escapeHtml(premioMensualActual?.estrategia || 'Premio por cumplimiento')}"></label>
          <label>Premio por cumplir 3 de 4 metas (COP)<input name="tres" type="number" min="0" max="1000000000" step="0.01" placeholder="Valor en pesos" value="${premioMensualActual?.premio_tres ?? ''}"></label>
          <label>Premio por cumplir 4 de 4 metas (COP)<input name="cuatro" type="number" min="0" max="1000000000" step="0.01" placeholder="Valor en pesos" value="${premioMensualActual?.premio_cuatro ?? ''}"></label>
        </div>
        <p>Son dos niveles alternativos: los premios no se suman. Deja vacío un nivel si no ofrece premio.</p>
        <button type="submit" class="btn-secundario">Guardar estrategia para todas</button><p data-premio-status role="status"></p>
      </form></div>` : '';
    grid.innerHTML = cartas.map(c => `<article class="carta-preview" data-carta-tienda="${escapeHtml(c.tienda.codigo)}">
      <h3>${escapeHtml(c.tienda.nombre)}</h3>
      <p>${c.diasRegistrados} de ${c.diasMes} días registrados en KORA</p>
      ${c.completo ? '<div data-carta-documento></div>' : '<p>Completa o aprueba el presupuesto antes de emitir esta carta.</p>'}
    </article>`).join('');
    grid.querySelectorAll('[data-carta-tienda]').forEach(article => {
      const carta = cartasActuales.get(article.dataset.cartaTienda);
      if (!carta?.completo) return;
      const frame = document.createElement('iframe');
      frame.title = `Carta de presupuesto de ${carta.tienda.nombre} · ${carta.mes}`;
      frame.style.cssText = 'display:block;width:100%;height:1200px;border:0;background:white';
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        const ajustar = () => { frame.style.height = `${doc.body.scrollHeight + 80}px`; };
        ajustar();
        frame.contentWindow.addEventListener('resize', ajustar);
        doc.getElementById('imprimirCarta').addEventListener('click', () => {
          const anterior = document.title;
          document.title = doc.title;
          frame.contentWindow.addEventListener('afterprint', () => { document.title = anterior; }, { once: true });
          frame.contentWindow.print();
        });
      });
      frame.srcdoc = KoraPresupuestosRetailCartas.cartaHtml(carta);
      article.querySelector('[data-carta-documento]').appendChild(frame);
    });
    const form = premioContenedor.querySelector('#premioMensualForm');
    if (form) {
      const status = form.querySelector('[data-premio-status]');
      form.addEventListener('input', () => { status.textContent = 'Cambios sin guardar. Las cartas muestran la estrategia guardada.'; });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const payload = KoraPresupuestosRetailCartas.premioPayload(mes, premioMensualActual, {
            activo: form.elements.activo.checked, estrategia: form.elements.estrategia.value,
            tres: form.elements.tres.value, cuatro: form.elements.cuatro.value
          });
          const { data, error } = await sb.rpc('guardar_presupuesto_premio_mensual', payload);
          if (error) throw error;
          if (!data || data.mes !== mes + '-01') throw new Error('No se confirmó el guardado de la estrategia mensual.');
          premioMensualActual = data;
          for (const carta of cartas) {
            carta.premio = data;
            const frame = grid.querySelector(`[data-carta-tienda="${carta.tienda.codigo}"] iframe`);
            if (frame) frame.srcdoc = KoraPresupuestosRetailCartas.cartaHtml(carta);
          }
          status.textContent = data.activo
            ? 'Estrategia activa y actualizada en todas las cartas del mes.'
            : 'Estrategia guardada como borrador; no aparece en las cartas hasta activarla.';
        } catch (ex) { status.textContent = ex.message || 'No se pudo guardar la estrategia.'; }
        finally { button.disabled = false; }
      });
    }
    document.getElementById('bannerOk').classList.remove('show');
    seccion.hidden = false;
    seccion.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return cartas;
  } catch (ex) {
    err.textContent = 'No se pudieron generar las cartas: ' + ex.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Generar presupuestos';
    if (!descargaCartasEnCurso) document.getElementById('btnDescargarCartas').disabled = false;
  }
}

let descargaCartasEnCurso = false;
const libreriasCartas = new Map();
function cargarLibreriaCartas(src) {
  if (!libreriasCartas.has(src)) libreriasCartas.set(src, new Promise((resolve,reject) => {
    const script=document.createElement('script');script.src=src;
    script.onload=resolve;
    script.onerror=()=>{ script.remove();libreriasCartas.delete(src);reject(new Error('No se pudo cargar la herramienta PDF/ZIP. Intenta de nuevo.')); };
    document.head.appendChild(script);
  }));
  return libreriasCartas.get(src);
}
async function descargarTodasCartas() {
  if(descargaCartasEnCurso)return;
  descargaCartasEnCurso=true;
  const button=document.getElementById('btnDescargarCartas');
  const controls=['genTienda','genMes','btnGenerarCartas','btnAprobarPropuesta','btnAprobarTodo'].map(id=>document.getElementById(id)).filter(Boolean);
  const previous=controls.map(el=>el.disabled);
  controls.forEach(el=>el.disabled=true);button.disabled=true;button.textContent='Preparando todas las cartas...';
  const estado=document.getElementById('cartasEstado'), err=document.getElementById('genErr');
  try {
    // Relee las metas y los premios guardados: nunca aprueba ni escribe presupuestos.
    const cartas=await generarCartasPresupuesto({todas:true});
    controls.forEach(el=>el.disabled=true);
    if(!cartas)return;
    const files=KoraCartasDescarga.archivos(JSON.parse(JSON.stringify(cartas)));
    await Promise.all([
      cargarLibreriaCartas('vendor/jspdf-4.2.1.umd.min.js'),
      cargarLibreriaCartas('vendor/fflate-0.8.3.js')
    ]);
    const response=await fetch('/creditek/shared/branding/creditek-logo.png');
    if(!response.ok)throw new Error('No se pudo cargar el logo. No se descargaron cartas sin la marca.');
    const logo=new Uint8Array(await response.arrayBuffer()), entries=Object.create(null);
    for(let i=0;i<files.length;i++){
      button.textContent=`Preparando carta ${i+1} de ${files.length}...`;
      entries[files[i].nombre]=KoraCartasDescarga.pdf(files[i].carta,logo,window.jspdf.jsPDF);
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    const zip=window.fflate.zipSync(entries,{level:0});
    const url=URL.createObjectURL(new Blob([zip],{type:'application/zip'}));
    const link=document.createElement('a');link.href=url;link.download='PPTO Tiendas '+KoraCartasDescarga.periodo(cartas[0].mes)+'.zip';
    document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    estado.textContent=`ZIP preparado con ${files.length} cartas PDF, una por tienda. Revisa Descargas en tu navegador.`;
  }catch(ex){err.textContent=ex.message || 'No se pudo preparar la descarga.';err.classList.add('show');}
  finally{controls.forEach((el,i)=>el.disabled=previous[i]);button.disabled=false;button.textContent='Descargar todas las cartas (ZIP)';descargaCartasEnCurso=false;}
}

// ─── Importar histórico (CSV: tienda_codigo,fecha,creditos,celulares_contado,accesorios,utilidad) ──
async function importarHistorico(e) {
  const file = e.target.files[0];
  if (!file) return;
  const err = document.getElementById('genErr');
  err.classList.remove('show');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: null });
    const normalizadas = rows.map(r => {
      const n = {}; for (const k in r) n[String(k).trim().toLowerCase()] = r[k];
      return {
        tienda_codigo: String(n['tienda_codigo'] || n['tienda'] || '').trim(),
        fecha: n['fecha'] ? new Date(n['fecha']).toISOString().slice(0, 10) : null,
        creditos: Number(n['creditos'] || 0),
        equipos_contado_cantidad: Number(n['celulares_contado'] || n['equipos_contado_cantidad'] || 0),
        accesorios_cantidad: Number(n['accesorios'] || n['accesorios_cantidad'] || 0),
        utilidad: Number(n['utilidad'] || 0),
      };
    }).filter(r => r.tienda_codigo && r.fecha);
    if (!normalizadas.length) { err.textContent = 'No se encontraron filas válidas (columnas esperadas: tienda_codigo, fecha, creditos, celulares_contado, accesorios, utilidad).'; err.classList.add('show'); return; }
    const { error } = await sb.from('historico_importado').upsert(normalizadas, { onConflict: 'tienda_codigo,fecha' });
    if (error) { err.textContent = 'No se pudo importar: ' + error.message; err.classList.add('show'); return; }
    mostrarBanner(`✅ ${normalizadas.length} fila(s) de histórico importadas. Ahora "Generar presupuesto" las usará como base.`);
  } catch (ex) {
    err.textContent = 'No se pudo leer el archivo: ' + ex.message;
    err.classList.add('show');
  } finally {
    e.target.value = '';
  }
}

// ─── Tabla de presupuesto ────────────────────────────────────────────────
async function cargarPresupuesto() {
  const mesStr = document.getElementById('verMes').value;
  presupuestoCache = [];
  renderTabla();
  if (!mesStr) return;
  const inicio = mesStr + '-01';
  const [y, m] = mesStr.split('-').map(Number);
  const fin = new Date(y, m, 1).toISOString().slice(0, 10);

  const { data, error } = await sb.from('presupuestos').select('*').gte('fecha', inicio).lt('fecha', fin);
  if (document.getElementById('verMes').value !== mesStr) return;
  if (error) { document.getElementById('emptyPresupuesto').style.display = 'block'; document.getElementById('emptyPresupuesto').textContent = 'Error: ' + error.message; return; }
  presupuestoCache = (data || []).map(registro => ({ ...registro }));
  renderTabla();
  const aviso = document.getElementById('avisoHistoricoAccesorios');
  if (aviso) {
    aviso.textContent = '';
    const historico = await sb.from('historico_mensual').select('tienda_codigo,acc_uds,acc_venta').eq('anio', y - 1).eq('mes', m);
    if (document.getElementById('verMes').value !== mesStr) return;
    if (historico.error) aviso.textContent = 'No se pudo verificar la cantidad histórica de accesorios.';
    else {
      const incompletas = (historico.data || []).filter(h => Number(h.acc_venta) > 0 && !(Number(h.acc_uds) > 0));
      aviso.textContent = incompletas.map(h => {
        const nombre = tiendasCache.find(t => t.codigo === h.tienda_codigo)?.nombre || h.tienda_codigo;
        return `${nombre}: el histórico de ${m}/${y - 1} registra ${fmtCOP(h.acc_venta)} en accesorios, pero no unidades. KORA estima la propuesta con el precio promedio de accesorios de esta misma tienda; esa cantidad es estimada, no una venta ni un consumo de inventario. Conviene verificar las unidades originales.`;
      }).join(' ');
    }
  }
}

function diasDelMesSeleccionado() {
  const mesStr = document.getElementById('verMes').value;
  const [y, m] = mesStr.split('-').map(Number);
  const dias = new Date(y, m, 0).getDate();
  return { y, m, dias };
}

function renderTabla() {
  const { y, m, dias } = diasDelMesSeleccionado();
  const thead = document.getElementById('theadFila');
  const tbody = document.getElementById('tbodyPresupuesto');
  const empty = document.getElementById('emptyPresupuesto');
  const footer = document.getElementById('tfootPresupuesto');
  const resumen = document.getElementById('totalesMes');
  if (footer) footer.innerHTML = '';
  if (resumen) resumen.hidden = true;

  if (!presupuestoCache.length) {
    thead.innerHTML = ''; tbody.innerHTML = '';
    empty.textContent = 'No hay presupuesto generado para este mes todavía.';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  let headHtml = '<th class="tienda-nombre">Tienda</th>';
  for (let d = 1; d <= dias; d++) {
    const fecha = new Date(y, m - 1, d);
    const esFinde = fecha.getDay() === 0;
    headHtml += `<th class="${esFinde ? 'finde' : ''}">${d}</th>`;
  }
  headHtml += '<th class="total-mes">Total mes</th>';
  thead.innerHTML = headHtml;

  const porTienda = {};
  presupuestoCache.forEach(p => {
    if (!porTienda[p.tienda_codigo]) porTienda[p.tienda_codigo] = {};
    porTienda[p.tienda_codigo][p.fecha] = p;
  });

  const indicadores = [
    ['meta_venta_total', 'Ventas', true], ['meta_creditos', 'Créditos', false],
    ['meta_uds_cel', 'Celulares (contado)', false], ['meta_uds_acc', 'Accesorios', false],
  ];
  const totales = Object.fromEntries(indicadores.map(([campo]) => [campo, 0]));
  const totalesDia = Array(dias).fill(0);
  const formato = (valor, dinero) => dinero ? fmtCOP(valor) : valor.toLocaleString('es-CO');

  tbody.innerHTML = tiendasCache.map(t => {
    let fila = `<td class="tienda-nombre">${escapeHtml(t.nombre)}</td>`;
    let total = 0;
    for (let d = 1; d <= dias; d++) {
      const fechaStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const reg = (porTienda[t.codigo] || {})[fechaStr];
      const val = reg ? Number(reg[metricaActual] || 0) : 0;
      total += val;
      totalesDia[d - 1] += val;
      indicadores.forEach(([campo]) => { totales[campo] += Number(reg?.[campo] || 0); });
      const esFinde = new Date(y, m - 1, d).getDay() === 0;
      const esManual = reg && reg.generado_desde === 'manual';
      const esDinero = metricaActual === 'meta_venta_total';
      const mostrar = esDinero ? fmtCOP(val).replace('$', '').replace(/\s/g, '') : val;
      fila += `<td class="dia-celda ${esFinde ? 'finde' : ''} ${esManual ? 'manual' : ''}" data-tienda="${t.codigo}" data-fecha="${fechaStr}" data-nombre="${escapeHtml(t.nombre)}" title="${esManual ? 'Editado manualmente' : 'Generado automáticamente'}">${mostrar}</td>`;
    }
    const totalMostrar = metricaActual === 'meta_venta_total' ? fmtCOP(total) : total;
    fila += `<td class="total-mes">${totalMostrar}</td>`;
    return `<tr>${fila}</tr>`;
  }).join('');

  if (resumen) {
    const mes = new Date(y, m - 1, 1).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
    document.getElementById('totalesMesTitulo').textContent = `${propuestaActual ? 'Propuesta sin aprobar' : 'Presupuesto total'} · ${mes} · ${tiendasCache.length} tiendas`;
    document.getElementById('totalesMesValores').innerHTML = indicadores.map(([campo, etiqueta, dinero]) =>
      `<div class="total-indicador"><span>${etiqueta}</span><strong data-total-metrica="${campo}">${formato(totales[campo], dinero)}</strong></div>`
    ).join('');
    resumen.hidden = false;
  }
  if (footer) {
    const dinero = indicadores.find(([campo]) => campo === metricaActual)?.[2];
    footer.innerHTML = '<tr><td class="tienda-nombre">Total todas las tiendas</td>' +
      totalesDia.map(valor => `<td>${formato(valor, dinero)}</td>`).join('') +
      `<td class="total-mes">${formato(totales[metricaActual], dinero)}</td></tr>`;
  }

  tbody.querySelectorAll('.dia-celda').forEach(td => td.addEventListener('click', () => abrirModalCelda(td)));
}

function abrirModalCelda(td) {
  celdaEnEdicion = { tienda: td.dataset.tienda, fecha: td.dataset.fecha, nombre: td.dataset.nombre };
  const labels = { meta_venta_total: 'Meta de ventas', meta_creditos: 'Meta de créditos', meta_uds_cel: 'Meta de celulares (contado)', meta_uds_acc: 'Meta de accesorios' };
  document.getElementById('celdaLabel').textContent = labels[metricaActual];
  document.getElementById('celdaContexto').textContent = `${celdaEnEdicion.nombre} · ${new Date(celdaEnEdicion.fecha + 'T00:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' })}`;
  const reg = presupuestoCache.find(p => p.tienda_codigo === celdaEnEdicion.tienda && p.fecha === celdaEnEdicion.fecha);
  document.getElementById('celdaValor').value = reg ? reg[metricaActual] : 0;
  document.getElementById('celdaErr').classList.remove('show');
  document.getElementById('modalCelda').classList.add('show');
}
document.getElementById('btnCancelarCelda').addEventListener('click', () => document.getElementById('modalCelda').classList.remove('show'));
document.getElementById('btnGuardarCelda').addEventListener('click', guardarCelda);

async function guardarCelda() {
  const err = document.getElementById('celdaErr');
  err.classList.remove('show');
  const valor = Number(document.getElementById('celdaValor').value);
  if (isNaN(valor) || valor < 0) { err.textContent = 'Ingresa un número válido.'; err.classList.add('show'); return; }

  const reg = presupuestoCache.find(p => p.tienda_codigo === celdaEnEdicion.tienda && p.fecha === celdaEnEdicion.fecha);
  const payload = {
    tienda_codigo: celdaEnEdicion.tienda, fecha: celdaEnEdicion.fecha,
    meta_creditos: reg ? reg.meta_creditos : 0,
    meta_uds_cel: reg ? reg.meta_uds_cel : 0,
    meta_uds_acc: reg ? reg.meta_uds_acc : 0,
    meta_venta_total: reg ? reg.meta_venta_total : 0,
    generado_desde: 'manual',
  };
  payload[metricaActual] = valor;

  const { error } = await sb.from('presupuestos').upsert(payload, { onConflict: 'tienda_codigo,fecha' });
  if (error) { err.textContent = 'No se pudo guardar: ' + error.message; err.classList.add('show'); return; }
  document.getElementById('modalCelda').classList.remove('show');
  await cargarPresupuesto();
}
</script>
