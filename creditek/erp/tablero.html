<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORA · Dashboard ejecutivo</title>
<link rel="stylesheet" href="/design-system/components/kora-dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/config/kora-environment.generated.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="kora-access-control.js?v=2.0.23"></script>
<script src="sidebar.js?v=2.0.23" data-kora-shell="1.0.0"></script>
<link rel="stylesheet" href="/design-system/components/kora-product.css">
<link rel="stylesheet" href="/design-system/components/kora-dashboard-premium.css?v=1.0.2">
<script src="aliados-reversiones-domain.js?v=1.0.0"></script>
<script src="tablero-ejecutivos.js?v=1.1.0"></script>
<script src="tablero-utilidad.js?v=1.0.1"></script>
<script src="/design-system/components/kora-product.js" defer></script>
</head>
<body data-kora-dashboard="1.0.0">

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img class="logo" src="/creditek/shared/branding/creditek-logo.png" alt="Creditek">
    <input type="email" id="loginEmail" placeholder="Correo" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
    <button id="btnLogin">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="sin-perfil-screen" id="sinPerfilScreen">
  <div class="sin-perfil-box">
    <div class="state-icon"><i data-lucide="lock-keyhole"></i></div>
    <h2>Sin perfil asignado</h2>
    <p>Tu usuario no tiene perfil asignado. Contacta al administrador.</p>
    <button id="btnSalirSinPerfil">Cerrar sesión</button>
  </div>
</div>

<div id="app">
  <div class="legacy-shell-hooks" aria-hidden="true">
    <b id="navNombre"></b><span id="navRolTienda"></span><button id="btnLogout"></button>
  </div>
  <div class="main-content">
  <div class="page" id="pageContenido"></div>
  </div>
</div>

<template id="tplAccesoNegado">
  <div class="acceso-negado">
    <div class="state-icon"><i data-lucide="shield-alert"></i></div>
    <h2>Solo gerencia o auditoría</h2>
    <p>El tablero gerencial no está disponible para roles de tienda.</p>
  </div>
</template>

<template id="tplTablero">
  <header class="dashboard-hero">
    <div>
      <p class="dashboard-subtitle">El pulso comercial y operativo de Creditek, en una sola vista.</p>
    </div>
    <div class="dashboard-updated">
      <span class="dashboard-updated__dot"></span>
      <span>Actualizado</span>
      <time id="fechaHoy"></time>
    </div>
  </header>

  <section class="dashboard-filterbar" aria-label="Filtros del tablero">
    <div class="dashboard-filterbar__title">
      <i data-lucide="sliders-horizontal"></i>
      <span>Vista</span>
    </div>
    <div class="campo">
      <label for="filtroPeriodo">Período</label>
      <select id="filtroPeriodo">
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes" selected>Este mes</option>
        <option value="rango">Rango personalizado</option>
      </select>
    </div>
    <div class="campo campo-rango" id="campoRangoDesde"><label for="rangoDesde">Desde</label><input type="date" id="rangoDesde"></div>
    <div class="campo campo-rango" id="campoRangoHasta"><label for="rangoHasta">Hasta</label><input type="date" id="rangoHasta"></div>
    <div class="campo">
      <label for="filtroTienda">Tienda</label>
      <select id="filtroTienda"><option value="">Consolidado (todas)</option></select>
    </div>
  </section>

  <section class="dashboard-metrics" aria-label="Indicadores principales">
    <article class="dashboard-metric">
      <div class="dashboard-metric__header">
        <span class="dashboard-metric__icon"><i data-lucide="badge-dollar-sign"></i></span>
        <span class="kpi-label">Ventas totales</span>
      </div>
      <div class="kpi-valor" id="kpiVentas">—</div>
      <div class="kpi-var" id="kpiVentasVar"></div>
    </article>
    <article class="dashboard-metric">
      <div class="dashboard-metric__header">
        <span class="dashboard-metric__icon"><i data-lucide="credit-card"></i></span>
        <span class="kpi-label">Créditos en liquidaciones</span>
      </div>
      <div class="kpi-valor" id="kpiCreditos">—</div>
      <div class="kpi-var" id="kpiCreditosVar"></div>
    </article>
    <article class="dashboard-metric">
      <div class="dashboard-metric__header">
        <span class="dashboard-metric__icon"><i data-lucide="chart-no-axes-combined"></i></span>
        <span class="kpi-label">Utilidad estimada</span>
      </div>
      <div class="kpi-valor" id="kpiUtilidad">—</div>
      <div class="kpi-var" id="kpiUtilidadVar"></div>
      <a href="utilidad-creditek.html" class="kpi-link">Consultar utilidad mensual</a>
    </article>
    <article class="dashboard-metric">
      <div class="dashboard-metric__header">
        <span class="dashboard-metric__icon"><i data-lucide="user-round-check"></i></span>
        <span class="kpi-label">Clientes pendientes</span>
      </div>
      <div class="kpi-valor" id="kpiPendientes">—</div>
      <div class="kpi-var flat">Pendientes de validación</div>
    </article>
  </section>

  <div class="dashboard-primary-grid">
    <section class="dashboard-panel dashboard-panel--table">
      <div class="dashboard-section-heading">
        <div>
          <p class="dashboard-section-heading__eyebrow">Operación comercial</p>
          <h2>Rendimiento por tienda</h2>
        </div>
        <span class="dashboard-section-heading__meta">Créditos de Liquidaciones · mes en curso</span>
      </div>
      <div class="tabla-wrap tabla-wrap--tiendas" role="region" aria-label="Rendimiento por tienda del mes vigente">
      <table class="dashboard-table dashboard-store-table">
        <thead><tr>
          <th>Tienda</th><th class="centro">Créditos / meta</th><th>Avance y proyección</th>
          <th class="num">Contado</th><th class="num">Utilidad</th><th class="centro">Caja</th>
        </tr></thead>
        <tbody id="tbodyTiendas"></tbody>
        <tfoot id="tfootTotal"></tfoot>
      </table>
      <div class="empty-state" id="emptyTiendas" style="display:none;"></div>
      </div>
    </section>

    <aside class="dashboard-panel dashboard-alerts-panel">
      <div class="dashboard-section-heading">
        <div>
          <p class="dashboard-section-heading__eyebrow">Atención requerida</p>
          <h2>Alertas operativas</h2>
        </div>
        <span class="dashboard-alert-count" aria-hidden="true"></span>
      </div>
      <div class="alertas-lista" id="listaAlertas" aria-live="polite">
        <div class="dashboard-loading-state" role="status">
          <span class="ctk-spinner" aria-hidden="true"></span>
          <span>Consultando alertas operativas…</span>
        </div>
      </div>
    </aside>
  </div>

  <section class="dashboard-support-grid" aria-label="Análisis del mes">
    <article class="dashboard-panel dashboard-chart-panel">
      <div class="dashboard-section-heading">
        <div>
          <p class="dashboard-section-heading__eyebrow">Créditos</p>
          <h2>Logrado frente a meta</h2>
        </div>
        <span class="dashboard-section-heading__icon"><i data-lucide="bar-chart-3"></i></span>
      </div>
      <div class="grafico-box"><canvas id="chartCreditos"></canvas></div>
      <p class="dashboard-executives-note" id="creditosFuente" role="status">Fuente: Liquidaciones · todas las plataformas · fecha de venta.</p>
    </article>
    <article class="dashboard-panel dashboard-chart-panel dashboard-chart-panel--primary">
      <div class="dashboard-section-heading">
        <div>
          <p class="dashboard-section-heading__eyebrow">Rentabilidad</p>
          <h2 id="utilidadTitulo">Utilidad acumulada · Retail</h2>
        </div>
        <span class="dashboard-section-heading__icon"><i data-lucide="trending-up"></i></span>
      </div>
      <div class="dashboard-profit-tabs" role="tablist" aria-label="Negocio de la utilidad">
        <button type="button" role="tab" id="utilidadTab-retail" data-utilidad-negocio="retail" aria-selected="true" aria-controls="utilidadPanel">Retail</button>
        <button type="button" role="tab" id="utilidadTab-b2b" data-utilidad-negocio="b2b" aria-selected="false" aria-controls="utilidadPanel" tabindex="-1">B2B</button>
        <button type="button" role="tab" id="utilidadTab-aliados" data-utilidad-negocio="aliados" aria-selected="false" aria-controls="utilidadPanel" tabindex="-1">Aliados</button>
      </div>
      <div id="utilidadPanel" role="tabpanel" aria-labelledby="utilidadTab-retail">
        <p class="dashboard-profit-total" id="utilidadTotal" aria-live="polite">Consultando…</p>
        <p class="dashboard-profit-context" id="utilidadContexto"></p>
        <div class="grafico-box"><canvas id="chartUtilidad" role="img"></canvas></div>
        <p class="dashboard-profit-context" id="utilidadPresupuesto"></p>
      </div>
    </article>
  </section>

  <section class="dashboard-panel dashboard-executives" id="ejecutivos">
    <div class="dashboard-section-heading">
      <div>
        <p class="dashboard-section-heading__eyebrow">Red comercial</p>
        <h2>Desempeño ejecutivo</h2>
      </div>
      <span class="dashboard-section-heading__meta">Mes en curso</span>
    </div>
    <div class="tabla-wrap" tabindex="0" role="region" aria-label="Desempeño ejecutivo; desplaza horizontalmente para ver todas las columnas">
      <table class="dashboard-table">
        <thead><tr><th>Ejecutivo</th><th class="centro">Aliadas activas</th><th class="centro">PayJoy</th><th class="centro">ALO Credit</th><th class="centro">Krediya</th><th class="centro">Créditos del mes</th><th class="num">Comisión registrada</th></tr></thead>
        <tbody id="tbodyEjecutivos"></tbody>
      </table>
      <div class="empty-state" id="emptyEjecutivos" style="display:none;">No hay ejecutivos registrados.</div>
    </div>
    <p class="dashboard-executives-note" id="ejecutivosNota" role="status">Fuente: Liquidaciones, por fecha de venta. Comisión registrada; no indica pagos realizados.</p>
  </section>
</template>

<script>
const KORA_ENV = window.__KORA_ENV__;
const SUPABASE_URL = KORA_ENV.KORA_ERP_SUPABASE_URL;
const SUPABASE_ANON_KEY = KORA_ENV.KORA_ERP_SUPABASE_ANON_KEY;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentPerfil = null;
let tiendasCache = [];
let chartCreditosObj = null;
let chartUtilidadObj = null;
let utilidadNegocio = 'retail';
let utilidadConsulta = 0;

function esCentral() { return !!currentPerfil && (currentPerfil.rol === 'gerencia' || currentPerfil.rol === 'auditoria'); }

document.getElementById('btnLogin').addEventListener('click', hacerLogin);
document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') hacerLogin(); });

async function hacerLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('loginErr');
  err.classList.remove('show');
  if (!email || !password) return;
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) { err.textContent = 'Correo o contraseña incorrectos.'; err.classList.add('show'); return; }
  entrarApp(data.user);
}

document.getElementById('btnLogout').addEventListener('click', cerrarSesion);
document.getElementById('btnSalirSinPerfil').addEventListener('click', cerrarSesion);
async function cerrarSesion() { await sb.auth.signOut(); location.reload(); }

async function entrarApp(user) {
  currentUser = user;
  const { data: perfil, error } = await sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !perfil || !perfil.activo) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('sinPerfilScreen').classList.add('show');
    return;
  }
  currentPerfil = perfil;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  pintarNavUser();
  initPagina();
}

function pintarNavUser() {
  document.getElementById('navNombre').textContent = currentPerfil.nombre || currentUser.email;
  const rolLabel = { gerencia: 'Gerencia', auditoria: 'Auditoría', admin_tienda: 'Admin tienda', asesor: 'Asesor' }[currentPerfil.rol] || currentPerfil.rol;
  document.getElementById('navRolTienda').textContent = currentPerfil.tienda_codigo ? `${rolLabel} · ${currentPerfil.tienda_codigo}` : rolLabel;
}

sb.auth.getSession().then(({ data }) => { if (data.session) entrarApp(data.session.user); });

function fmtCOP(n) { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(n || 0); }
function fmtCorto(n) {
  n = Number(n || 0);
  if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return fmtCOP(n);
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fechaISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function tokenColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function pintarIconos() { window.lucide?.createIcons(); }

function initPagina() {
  const sincronizarEncabezado = () => window.KoraNavigation?.setContext('Resumen ejecutivo', ['KORA', 'Tablero']);
  sincronizarEncabezado();
  document.addEventListener('kora-sidebar-ready', sincronizarEncabezado, { once: true });
  if (!esCentral()) {
    document.getElementById('pageContenido').innerHTML = '';
    document.getElementById('pageContenido').appendChild(document.getElementById('tplAccesoNegado').content.cloneNode(true));
    return;
  }
  const cont = document.getElementById('pageContenido');
  cont.innerHTML = '';
  cont.appendChild(document.getElementById('tplTablero').content.cloneNode(true));
  pintarIconos();

  document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('filtroPeriodo').addEventListener('change', onCambioFiltro);
  document.getElementById('rangoDesde').addEventListener('change', cargarKPIs);
  document.getElementById('rangoHasta').addEventListener('change', cargarKPIs);
  document.getElementById('filtroTienda').addEventListener('change', () => { cargarKPIs(); cargarTiendas_Tabla(); });
  const profitTabs = [...document.querySelectorAll('[data-utilidad-negocio]')];
  profitTabs.forEach((button,index) => {
    button.addEventListener('click', () => {
      utilidadNegocio = button.dataset.utilidadNegocio;
      actualizarUtilidad();
    });
    button.addEventListener('keydown', event => {
      const target = event.key === 'ArrowRight' ? (index+1)%profitTabs.length : event.key === 'ArrowLeft' ? (index+profitTabs.length-1)%profitTabs.length : event.key === 'Home' ? 0 : event.key === 'End' ? profitTabs.length-1 : -1;
      if(target>=0){event.preventDefault();profitTabs[target].focus();profitTabs[target].click();}
    });
  });

  cargarTiendasSelect().then(() => {
    cargarKPIs();
    cargarTiendas_Tabla();
    cargarEjecutivos();
  });
}

function onCambioFiltro() {
  const periodo = document.getElementById('filtroPeriodo').value;
  document.getElementById('campoRangoDesde').style.display = periodo === 'rango' ? 'block' : 'none';
  document.getElementById('campoRangoHasta').style.display = periodo === 'rango' ? 'block' : 'none';
  if (periodo !== 'rango') cargarKPIs();
}

async function cargarTiendasSelect() {
  const { data } = await sb.from('origenes').select('codigo, nombre').eq('tipo', 'propia').eq('activo', true).order('nombre');
  tiendasCache = data || [];
  document.getElementById('filtroTienda').innerHTML = '<option value="">Consolidado (todas)</option>' +
    tiendasCache.map(t => `<option value="${t.codigo}">${escapeHtml(t.nombre)}</option>`).join('');
}

function nombreTienda(codigo) { return tiendasCache.find(t => t.codigo === codigo)?.nombre || codigo; }

function rangoSeleccionado() {
  const periodo = document.getElementById('filtroPeriodo').value;
  const hoy = new Date();
  if (periodo === 'hoy') { const s = hoyISO(); return { desde: s, hasta: s }; }
  if (periodo === 'semana') {
    const diaSemana = hoy.getDay() === 0 ? 7 : hoy.getDay(); // lunes=1..domingo=7
    const inicio = new Date(hoy); inicio.setDate(hoy.getDate() - (diaSemana - 1));
    return { desde: fechaISO(inicio), hasta: hoyISO() };
  }
  if (periodo === 'mes') {
    const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    return { desde: fechaISO(inicio), hasta: hoyISO() };
  }
  const desde = document.getElementById('rangoDesde').value || hoyISO();
  const hasta = document.getElementById('rangoHasta').value || hoyISO();
  return { desde, hasta };
}

// Punto de comparación: mismo rango, desplazado 7 días atrás (mismo día de la semana)
function rangoComparacion(rango) {
  const desplazar = (s) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - 7); return fechaISO(d); };
  return { desde: desplazar(rango.desde), hasta: desplazar(rango.hasta) };
}

let creditosLiquidacionesPromise;
function obtenerCreditosLiquidaciones() {
  if (!creditosLiquidacionesPromise) creditosLiquidacionesPromise = CreditekTableroEjecutivos.loadCreditData(sb).catch(error => {
    creditosLiquidacionesPromise = null;
    throw error;
  });
  return creditosLiquidacionesPromise;
}
function creditosTiendas(data, period, tiendas) {
  const codes = new Set(tiendas.map(t => t.codigo));
  return CreditekTableroEjecutivos.credits(data, period).filter(o => o.tipo_establecimiento === 'propia' && codes.has(o.origen_codigo));
}
async function sumVentasCreditosUtilidad(desde, hasta, tienda) {
  let qv = sb.from('ventas').select('id, total, tipo').gte('fecha', desde).lte('fecha', hasta).eq('anulada', false);
  if (tienda) qv = qv.eq('tienda_codigo', tienda);
  const { data: ventas } = await qv;
  const ids = (ventas || []).map(v => v.id);
  const totalVentas = (ventas || []).reduce((s, v) => s + Number(v.total || 0), 0);
  let totalCreditos = null;
  try {
    const end = new Date(hasta + 'T12:00:00Z'); end.setUTCDate(end.getUTCDate() + 1);
    const records = creditosTiendas(await obtenerCreditosLiquidaciones(), {start:desde,end:end.toISOString().slice(0,10)}, tienda ? tiendasCache.filter(t => t.codigo === tienda) : tiendasCache);
    totalCreditos = CreditekReversiones.creditCount(records);
  } catch (error) { console.error('Créditos en Liquidaciones:', error); }

  let totalUtilidad = 0;
  if (ids.length) {
    const { data: items } = await sb.from('venta_items_lectura').select('utilidad, venta_id').in('venta_id', ids);
    totalUtilidad = (items || []).reduce((s, i) => s + Number(i.utilidad || 0), 0);
  }
  return { ventas: totalVentas, creditos: totalCreditos, utilidad: totalUtilidad };
}

function pintarVariacion(elId, actual, anterior) {
  const el = document.getElementById(elId);
  if (!anterior) { el.textContent = actual ? 'nuevo' : '—'; el.className = 'kpi-var flat'; return; }
  const pct = ((actual - anterior) / anterior) * 100;
  const flecha = pct > 0 ? '▲' : pct < 0 ? '▼' : '—';
  el.textContent = `${flecha} ${Math.abs(pct).toFixed(0)}% vs. misma semana pasada`;
  el.className = 'kpi-var ' + (pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat');
}

async function cargarKPIs() {
  const tienda = document.getElementById('filtroTienda').value;
  const rango = rangoSeleccionado();
  const comp = rangoComparacion(rango);

  const [actual, anterior] = await Promise.all([
    sumVentasCreditosUtilidad(rango.desde, rango.hasta, tienda),
    sumVentasCreditosUtilidad(comp.desde, comp.hasta, tienda),
  ]);

  document.getElementById('kpiVentas').textContent = fmtCOP(actual.ventas);
  pintarVariacion('kpiVentasVar', actual.ventas, anterior.ventas);
  document.getElementById('kpiCreditos').textContent = actual.creditos === null ? 'No disponible' : `${actual.creditos} uds`;
  if (actual.creditos !== null && anterior.creditos !== null) pintarVariacion('kpiCreditosVar', actual.creditos, anterior.creditos);
  else document.getElementById('kpiCreditosVar').textContent = 'No se pudo consultar Liquidaciones.';
  document.getElementById('kpiUtilidad').textContent = fmtCOP(actual.utilidad);
  pintarVariacion('kpiUtilidadVar', actual.utilidad, anterior.utilidad);

  let qp = sb.from('solicitudes').select('id', { count: 'exact', head: true }).eq('estado_validacion', 'pendiente');
  const { count } = await qp;
  document.getElementById('kpiPendientes').textContent = `${count ?? 0}`;
}

// ─── Tabla de tiendas: cumplimiento del mes ──────────────────────────────
async function cargarTiendas_Tabla() {
  const tiendaFiltro = document.getElementById('filtroTienda').value;
  const hoy = new Date();
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const finMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 1);
  const inicioMesStr = fechaISO(inicioMes);
  const finMesStr = fechaISO(finMes);
  const diasTranscurridos = hoy.getDate();
  const diasDelMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();

  const tiendas = tiendaFiltro ? tiendasCache.filter(t => t.codigo === tiendaFiltro) : tiendasCache;

  let operacionesMes;
  try {
    operacionesMes = creditosTiendas(await obtenerCreditosLiquidaciones(), {start:inicioMesStr,end:finMesStr}, tiendas);
    document.getElementById('chartCreditos').hidden = false;
    document.getElementById('creditosFuente').textContent = 'Fuente: Liquidaciones · todas las plataformas · fecha de venta.';
  } catch (error) {
    document.getElementById('tbodyTiendas').innerHTML = '';
    document.getElementById('tfootTotal').innerHTML = '';
    const empty = document.getElementById('emptyTiendas');
    empty.style.display = 'block';
    empty.textContent = 'No se pudo consultar Liquidaciones. Actualiza para reintentar.';
    if (chartCreditosObj) { chartCreditosObj.destroy(); chartCreditosObj = null; }
    document.getElementById('chartCreditos').hidden = true;
    document.getElementById('creditosFuente').textContent = 'Créditos no disponibles. No se sustituyen por ventas de tienda.';
    console.error('Cumplimiento desde Liquidaciones:', error);
    return;
  }

  const { data: ventasMes } = await sb.from('ventas').select('id, tienda_codigo, tipo, total, fecha').gte('fecha', inicioMesStr).lt('fecha', finMesStr).eq('anulada', false);
  const idsVentas = (ventasMes || []).map(v => v.id);
  let itemsMes = [];
  if (idsVentas.length) {
    const { data } = await sb.from('venta_items_lectura').select('venta_id, utilidad').in('venta_id', idsVentas);
    itemsMes = data || [];
  }
  const { data: presupuestoMes } = await sb.from('presupuestos').select('tienda_codigo, meta_creditos').gte('fecha', inicioMesStr).lt('fecha', finMesStr);
  const { data: cajasMes } = await sb.from('caja_diaria').select('tienda_codigo, fecha, estado').gte('fecha', inicioMesStr).lt('fecha', finMesStr);

  const utilidadPorVenta = {};
  itemsMes.forEach(i => { utilidadPorVenta[i.venta_id] = (utilidadPorVenta[i.venta_id] || 0) + Number(i.utilidad || 0); });

  const filas = tiendas.map(t => {
    const ventasTienda = (ventasMes || []).filter(v => v.tienda_codigo === t.codigo);
    const creditosMes = CreditekReversiones.creditCount(operacionesMes.filter(o => o.origen_codigo === t.codigo));
    const contadoMes = ventasTienda.filter(v => v.tipo === 'contado').reduce((s, v) => s + Number(v.total || 0), 0);
    const utilidadMes = ventasTienda.reduce((s, v) => s + (utilidadPorVenta[v.id] || 0), 0);
    const metaMes = (presupuestoMes || []).filter(p => p.tienda_codigo === t.codigo).reduce((s, p) => s + Number(p.meta_creditos || 0), 0);
    const pct = metaMes > 0 ? (creditosMes / metaMes) * 100 : null;
    const runRate = (creditosMes / diasTranscurridos) * diasDelMes;
    const pctRunRate = metaMes > 0 ? (runRate / metaMes) * 100 : null;

    // Caja: ¿hay algún día ANTERIOR a hoy con ventas/gastos y sin caja cerrada?
    const diasConVenta = new Set(ventasTienda.map(v => v.fecha).filter(f => f < hoyISO()));
    const cajasTienda = (cajasMes || []).filter(c => c.tienda_codigo === t.codigo);
    let cajaOk = true;
    diasConVenta.forEach(f => {
      const cerrada = cajasTienda.some(c => c.fecha === f && c.estado === 'cerrada');
      if (!cerrada) cajaOk = false;
    });

    let semaforo = 'neutral';
    if (pctRunRate !== null) semaforo = pctRunRate >= 90 ? 'success' : pctRunRate >= 70 ? 'warning' : 'danger';

    return { tienda: t, creditosMes, metaMes, pct, runRate, contadoMes, utilidadMes, cajaOk, semaforo, pctRunRate };
  });

  renderTablaTiendas(filas);
  dibujarGraficos(filas, inicioMes, diasDelMes, hoy.getDate(), tiendaFiltro);
  calcularAlertas(filas, ventasMes, hoy);
}

function renderTablaTiendas(filas) {
  const tbody = document.getElementById('tbodyTiendas');
  const empty = document.getElementById('emptyTiendas');
  if (!filas.length) { tbody.innerHTML = ''; empty.style.display = 'block'; empty.textContent = 'No hay tiendas para mostrar.'; document.getElementById('tfootTotal').innerHTML = ''; return; }
  empty.style.display = 'none';

  const colorBarra = (pct) => pct === null
    ? 'var(--ctk-color-neutral-300)'
    : pct >= 90
      ? 'var(--ctk-color-success-500)'
      : pct >= 70
        ? 'var(--ctk-color-warning-500)'
        : 'var(--ctk-color-danger-500)';

  tbody.innerHTML = filas.map(f => `
    <tr>
      <td class="store-name">${escapeHtml(f.tienda.nombre)}</td>
      <td class="centro store-goal"><strong>${f.creditosMes}</strong><span>/ ${f.metaMes || '—'}</span></td>
      <td class="store-progress">
        <div class="store-progress__main">
          <span class="barra-pct"><span style="width:${Math.min(f.pct || 0, 100)}%; background:${colorBarra(f.pct)};"></span></span>
          <strong>${f.pct === null ? '—' : Math.round(f.pct) + '%'}</strong>
        </div>
        <div class="store-progress__detail">
          <span>Proy. ${Math.round(f.runRate)}</span>
          <span class="status-indicator status-indicator--${f.semaforo}">
            <i data-lucide="circle"></i>
            ${f.pctRunRate === null ? 'Sin meta' : Math.round(f.pctRunRate) + '% ritmo'}
          </span>
        </div>
      </td>
      <td class="num">${fmtCorto(f.contadoMes)}</td>
      <td class="num">${fmtCorto(f.utilidadMes)}</td>
      <td class="centro">
        <span class="status-indicator status-indicator--${f.cajaOk ? 'success' : 'warning'}">
          <i data-lucide="${f.cajaOk ? 'circle-check' : 'triangle-alert'}"></i>
          ${f.cajaOk ? 'Al día' : 'Revisar'}
        </span>
      </td>
    </tr>
  `).join('');

  const totalCreditos = filas.reduce((s, f) => s + f.creditosMes, 0);
  const totalMeta = filas.reduce((s, f) => s + f.metaMes, 0);
  const totalContado = filas.reduce((s, f) => s + f.contadoMes, 0);
  const totalUtilidad = filas.reduce((s, f) => s + f.utilidadMes, 0);
  const totalPct = totalMeta > 0 ? Math.round((totalCreditos / totalMeta) * 100) : 0;
  document.getElementById('tfootTotal').innerHTML = `
    <tr class="fila-total">
      <td>TOTAL</td><td class="centro store-goal"><strong>${totalCreditos}</strong><span>/ ${totalMeta || '—'}</span></td>
      <td class="store-progress"><strong>${totalMeta > 0 ? totalPct + '%' : '—'}</strong></td>
      <td class="num">${fmtCorto(totalContado)}</td><td class="num">${fmtCorto(totalUtilidad)}</td><td class="centro">—</td>
    </tr>
  `;
  pintarIconos();
}

// ─── Gráficos ─────────────────────────────────────────────────────────────
function dibujarGraficos(filas, inicioMes, diasDelMes, diasTranscurridos, tiendaFiltro) {
  const ctx1 = document.getElementById('chartCreditos');
  if (chartCreditosObj) chartCreditosObj.destroy();
  const etiquetasCreditos = filas.map(f => Number(f.metaMes) > 0
    ? `${f.creditosMes} de ${f.metaMes}`
    : `${f.creditosMes} · sin meta`);
  const fuenteEtiquetas = `11px ${Chart.defaults.font.family}`;
  const contextoEtiquetas = ctx1.getContext('2d');
  contextoEtiquetas.save();
  contextoEtiquetas.font = fuenteEtiquetas;
  const espacioEtiquetas = Math.ceil(Math.max(0, ...etiquetasCreditos.map(texto => contextoEtiquetas.measureText(texto).width))) + 16;
  contextoEtiquetas.restore();
  ctx1.setAttribute('role', 'img');
  ctx1.setAttribute('aria-label', `Créditos logrados frente a meta: ${filas.map((f, i) => `${f.tienda.nombre}: ${etiquetasCreditos[i]}`).join('; ')}`);
  chartCreditosObj = new Chart(ctx1, {
    type: 'bar',
    plugins: [{
      id: 'creditos-logrado-meta',
      afterDatasetsDraw(chart) {
        const { ctx, scales } = chart;
        ctx.save();
        ctx.font = fuenteEtiquetas;
        ctx.fillStyle = tokenColor('--ctk-color-neutral-600');
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        etiquetasCreditos.forEach((texto, i) => {
          const extremos = chart.data.datasets.flatMap((_, datasetIndex) => {
            const barra = chart.getDatasetMeta(datasetIndex).data[i];
            return chart.isDatasetVisible(datasetIndex) && barra ? [barra.x] : [];
          });
          const fin = Math.max(scales.x.getPixelForValue(0), ...extremos);
          ctx.fillText(texto, fin + 8, scales.y.getPixelForValue(i));
        });
        ctx.restore();
      },
    }],
    data: {
      labels: filas.map(f => f.tienda.nombre),
      datasets: [
        { label: 'Logrado', data: filas.map(f => f.creditosMes), backgroundColor: tokenColor('--ctk-color-secondary-500'), borderRadius: 6, stack: 's' },
        { label: 'Faltante', data: filas.map(f => Math.max((f.metaMes || 0) - f.creditosMes, 0)), backgroundColor: tokenColor('--ctk-color-neutral-200'), borderRadius: 6, stack: 's' },
      ],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { right: espacioEtiquetas } },
      plugins: {
        legend: { position: 'bottom', align: 'start', labels: { usePointStyle: true, boxWidth: 8, padding: 18 } },
      },
      scales: {
        x: { stacked: true, beginAtZero: true, grid: { color: tokenColor('--ctk-color-neutral-100') }, border: { display: false } },
        y: { stacked: true, grid: { display: false }, border: { display: false } },
      },
    },
  });

  // Utilidad acumulada del mes (real) vs presupuesto acumulado, para la tienda filtrada o consolidado
  cargarSerieUtilidadAcumulada(inicioMes, diasDelMes, diasTranscurridos, tiendaFiltro);
}

function actualizarUtilidad() {
  const hoy = new Date();
  return cargarSerieUtilidadAcumulada(new Date(hoy.getFullYear(),hoy.getMonth(),1),0,0,document.getElementById('filtroTienda').value);
}
async function cargarSerieUtilidadAcumulada(inicioMes, diasDelMes, diasTranscurridos, tiendaFiltro) {
  const request = ++utilidadConsulta;
  const business = utilidadNegocio;
  const names = {retail:'Retail',b2b:'B2B',aliados:'Aliados'};
  const canvas = document.getElementById('chartUtilidad');
  const total = document.getElementById('utilidadTotal');
  const context = document.getElementById('utilidadContexto');
  const budget = document.getElementById('utilidadPresupuesto');
  document.querySelectorAll('[data-utilidad-negocio]').forEach(button => {
    const selected = button.dataset.utilidadNegocio === business;
    button.setAttribute('aria-selected',String(selected));
    button.tabIndex = selected ? 0 : -1;
  });
  document.getElementById('utilidadPanel').setAttribute('aria-labelledby','utilidadTab-'+business);
  document.getElementById('utilidadTitulo').textContent = 'Utilidad acumulada · '+names[business];
  if(chartUtilidadObj){chartUtilidadObj.destroy();chartUtilidadObj=null;}
  canvas.hidden=true;total.textContent='Consultando…';context.textContent='';budget.textContent='';
  try {
    const result = await CreditekTableroUtilidad.load(sb,business,{store:tiendaFiltro,creditData:business==='aliados'?obtenerCreditosLiquidaciones():undefined});
    if(request!==utilidadConsulta)return;
    total.textContent = fmtCOP(result.total)+(result.missing?' · parcial':'');
    const scope = business==='aliados' ? 'Ambos canales · todas las tiendas y terceros' : tiendaFiltro ? nombreTienda(tiendaFiltro) : 'Todas las tiendas';
    context.textContent = result.description+' '+scope+' · '+result.period.start+' a '+result.today+'. Escala automática.'+(result.missing?' '+result.missing+' registro(s) sin utilidad calculada.':'');
    budget.textContent = result.budget===null ? '' : 'Presupuesto mensual Retail: '+fmtCOP(result.budget)+' · referencia; no modifica la escala.';
    canvas.hidden=false;
    canvas.setAttribute('aria-label',names[business]+': utilidad acumulada '+fmtCOP(result.total)+', del '+result.period.start+' al '+result.today+(result.missing?', cálculo parcial':''));
    chartUtilidadObj=new Chart(canvas,CreditekTableroUtilidad.chartConfig(result,{money:fmtCOP,shortMoney:fmtCorto,color:tokenColor}));
  } catch(error) {
    if(request!==utilidadConsulta)return;
    total.textContent='No disponible';
    context.textContent='No se pudo consultar la utilidad de '+names[business]+'. Selecciona la pestaña para reintentar.';
    console.error('Utilidad por negocio:',error);
  }
}

// ─── Alertas ───────────────────────────────────────────────────────────
async function calcularAlertas(filas, ventasMes, hoy) {
  const alertas = [];
  const ayerStr = fechaISO(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 1));

  // Cajas de ayer sin cerrar (solo tiendas con actividad ayer)
  const { data: ventasAyer } = await sb.from('ventas').select('tienda_codigo').eq('fecha', ayerStr).eq('anulada', false);
  const { data: gastosAyer } = await sb.from('gastos').select('tienda_codigo').eq('fecha', ayerStr);
  const tiendasConActividadAyer = new Set([...(ventasAyer || []).map(v => v.tienda_codigo), ...(gastosAyer || []).map(g => g.tienda_codigo)]);
  const { data: cajasAyer } = await sb.from('caja_diaria').select('tienda_codigo, estado').eq('fecha', ayerStr);
  tiendasConActividadAyer.forEach(codigo => {
    const cerrada = (cajasAyer || []).some(c => c.tienda_codigo === codigo && c.estado === 'cerrada');
    if (!cerrada) alertas.push({ nivel: 'roja', texto: `${nombreTienda(codigo)}: caja de ayer sin cerrar` });
  });

  // Clientes pendientes de validación > 24h
  const hace24h = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  const { count: pendientes24h } = await sb.from('solicitudes').select('id', { count: 'exact', head: true }).eq('estado_validacion', 'pendiente').lt('created_at', hace24h);
  if (pendientes24h > 0) alertas.push({ nivel: 'roja', texto: `${pendientes24h} cliente(s) pendientes de validación hace más de 24h` });

  // Tiendas con 0 ventas hoy (después de mediodía)
  if (hoy.getHours() >= 12) {
    const hoyStr = hoyISO();
    filas.forEach(f => {
      const tuvoVentaHoy = (ventasMes || []).some(v => v.tienda_codigo === f.tienda.codigo && v.fecha === hoyStr);
      if (!tuvoVentaHoy) alertas.push({ nivel: 'roja', texto: `${f.tienda.nombre}: 0 ventas hoy` });
    });
  }

  // Stock bajo (< 3 unidades)
  const { data: stockBajo } = await sb.from('stock_cantidad_lectura').select('tienda_codigo, cantidad, productos(nombre)').lt('cantidad', 3);
  (stockBajo || []).slice(0, 8).forEach(s => {
    alertas.push({ nivel: 'amarilla', texto: `${nombreTienda(s.tienda_codigo)}: stock de ${s.productos?.nombre || '—'} en ${s.cantidad} unidad(es)` });
  });

  // Créditos sin conciliar (simplificado: total pendiente, no solo el último corte —
  // el spec habla del "último corte" pero un crédito pendiente sigue siendo relevante
  // aunque no sea del corte más reciente, así que se muestra el total global)
  const { count: pendientesConciliar } = await sb.from('creditos').select('id', { count: 'exact', head: true }).eq('estado_conciliacion', 'pendiente');
  if (pendientesConciliar > 0) alertas.push({ nivel: 'amarilla', texto: `${pendientesConciliar} crédito(s) sin conciliar con la financiera` });

  // Abonos sin verificar
  const { count: abonosSinVerificar } = await sb.from('abonos').select('id', { count: 'exact', head: true }).is('verificado_at', null);
  if (abonosSinVerificar > 0) alertas.push({ nivel: 'amarilla', texto: `${abonosSinVerificar} abono(s) sin verificar` });

  renderAlertas(alertas);
}

function renderAlertas(alertas) {
  const cont = document.getElementById('listaAlertas');
  if (!alertas.length) {
    cont.innerHTML = '<div class="alerta exitosa"><span class="icono"><i data-lucide="circle-check"></i></span><span>Sin alertas activas.</span></div>';
    pintarIconos();
    return;
  }
  const orden = { roja: 0, amarilla: 1 };
  alertas.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  cont.innerHTML = alertas.map(a => `
    <div class="alerta ${a.nivel}">
      <span class="icono"><i data-lucide="${a.nivel === 'roja' ? 'circle-alert' : 'triangle-alert'}"></i></span>
      <span>${escapeHtml(a.texto)}</span>
    </div>
  `).join('');
  pintarIconos();
}

// ─── Ejecutivos ────────────────────────────────────────────────────────
async function cargarEjecutivos() {
  const tbody = document.getElementById('tbodyEjecutivos');
  const empty = document.getElementById('emptyEjecutivos');
  const note = document.getElementById('ejecutivosNota');
  try {
    const {list, unassigned} = await CreditekTableroEjecutivos.load(sb, new Date(), obtenerCreditosLiquidaciones());
    empty.style.display = list.length ? 'none' : 'block';
    empty.textContent = 'No hay ejecutivos activos registrados.';
    tbody.innerHTML = list.sort((a,b) => a.name.localeCompare(b.name, 'es')).map(e =>
      `<tr><td>${escapeHtml(e.name)}</td><td class="centro">${e.activeAllies}</td><td class="centro">${e.platforms.payjoy}</td><td class="centro">${e.platforms.alo}</td><td class="centro">${e.platforms.krediya}</td><td class="centro">${e.credits}</td><td class="num">${fmtCOP(e.commission)}</td></tr>`
    ).join('');
    note.textContent = 'Fuente: Liquidaciones, por fecha de venta. Comisión registrada; no indica pagos realizados.' + (unassigned ? ` ${unassigned} crédito(s) de aliados sin ejecutivo activo asignado.` : '');
  } catch (error) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = 'No fue posible consultar el desempeño ejecutivo. Actualiza para reintentar.';
    note.textContent = 'Datos no disponibles; no se presentan ceros como si no hubiera ventas.';
    console.error('Desempeño ejecutivo:', error);
  }
}
